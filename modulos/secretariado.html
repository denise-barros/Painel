<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

</style></head><body>
<title>Operação</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: área de trabalho (cabeçalho, captura, quadro/lista/tabela) | painel estreito à direita (visões + esferas) | gaveta da demanda */
:root{
  --bg:#E1E9DF; --surface:#FFFFFF; --surface-2:#F1F5EF; --line:#C3D3C9; --line-2:#D3E0D8;
  --ink:#1F2A25; --muted:#526159; --faint:#7E8C84;
  --lime:#3F7A62; --lime-ink:#FFFFFF; --accent:#3F7A62; --accent-soft:#DCEBE3;
  --slate:#FFFFFF; --slate-2:#F1F5EF; --slate-line:#D3E0D8; --slate-ink:#1F2A25; --slate-muted:#526159;
  --pess:#B0305E; --pess-soft:#FBE1EA; --corp:#22665E; --corp-soft:#D7ECE8;
  --danger:#C2366B; --danger-soft:#FBE1EA; --warn:#B0305E; --warn-soft:#FCE8EF; --ok:#3F7A5F; --ok-soft:#DCEBE3;
  --c-nova:#7FB8A5; --c-and:#E58FAE; --c-agu:#C2588A; --c-con:#3F7A5F;
  --shadow:0 1px 2px rgba(31,42,37,.06),0 2px 8px rgba(31,42,37,.05);
  --shadow-lg:0 12px 40px rgba(31,42,37,.18);
  --f-display:"Sora","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --pill:999px;
  --sunk:#F1F5EF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141a; --surface:#1a1e26; --surface-2:#20252f; --line:#2f3644; --line-2:#272d38;
  --ink:#e6e9ef; --muted:#a0a8b6; --faint:#737c8c;
  --lime:#86BFA6; --lime-ink:#0E1F18; --accent:#86BFA6; --accent-soft:#1F3A30;
  --slate:#1a1e26; --slate-2:#20252f; --slate-line:#2f3644; --slate-ink:#e6e9ef; --slate-muted:#a0a8b6;
  --pess:#d791db; --pess-soft:#3a2440; --corp:#55c6b6; --corp-soft:#173a36;
  --danger:#E8928A; --danger-soft:#45221E; --warn:#f1b858; --warn-soft:#3d2f15; --ok:#79d287; --ok-soft:#1d3721;
  --c-nova:#86BFA6; --c-and:#E58FAE; --c-agu:#D27BA8; --c-con:#4fa862;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#1a1e26; --surface-2:#20252f; --line:#2f3644; --line-2:#272d38;
  --ink:#e6e9ef; --muted:#a0a8b6; --faint:#737c8c;
  --lime:#86BFA6; --lime-ink:#0E1F18; --accent:#86BFA6; --accent-soft:#1F3A30;
  --slate:#1a1e26; --slate-2:#20252f; --slate-line:#2f3644; --slate-ink:#e6e9ef; --slate-muted:#a0a8b6;
  --pess:#d791db; --pess-soft:#3a2440; --corp:#55c6b6; --corp-soft:#173a36;
  --danger:#E8928A; --danger-soft:#45221E; --warn:#f1b858; --warn-soft:#3d2f15; --ok:#79d287; --ok-soft:#1d3721;
  --c-nova:#86BFA6; --c-and:#E58FAE; --c-agu:#D27BA8; --c-con:#4fa862;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:11px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:minmax(0,1fr);height:100%}
.main{order:1}

/* Painel lateral escuro */
.side{order:2;border-left:1px solid var(--line);background:var(--slate);color:var(--slate-ink);display:flex;flex-direction:column;min-height:0;padding-right:env(safe-area-inset-right,0px);font-size:10.5px}
.brand{padding:16px 16px 12px;display:flex;align-items:center;gap:9px}
.brand-mark{width:28px;height:28px;border-radius:9px;background:#6B7A72;color:#FFFFFF;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:9.5px;letter-spacing:-.02em}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:11.5px;letter-spacing:-.03em;margin:0;line-height:1.1}
.brand small{display:none}
.side-scroll{overflow:auto;flex:1;padding:2px 10px 20px}
.btn-new{margin:2px 14px 10px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--lime);color:var(--lime-ink);border:0;border-radius:var(--pill);padding:9px 12px;font-weight:700;letter-spacing:-.01em}
.btn-new:hover{filter:brightness(1.05)}
.btn-new kbd{font-family:var(--f-mono);font-size:9.5px;opacity:.7;border:1px solid currentColor;border-radius:5px;padding:0 4px}
.nav-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--slate-muted);font-weight:700;padding:16px 8px 6px;display:flex;align-items:center;justify-content:space-between}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 10px;border-radius:var(--pill);color:var(--slate-ink)}
.nav-item:hover{background:var(--slate-2)}
.nav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav-item .ico{width:15px;height:15px;flex:none;color:var(--slate-muted)}
.nav-item.on .ico{color:var(--accent)}
.nav-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-family:var(--f-mono);font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.side .cnt{color:var(--slate-muted)}
.nav-item.on .cnt{color:var(--accent)}
.cnt.alert,.side .cnt.alert,.nav-item.on .cnt.alert{color:var(--danger);font-weight:700}
.nav-item.drop-hover,.sph-head.drop-hover{outline:2px dashed var(--lime);outline-offset:-2px}

.sph{margin-top:8px}
.sph-head{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;border-radius:var(--pill)}
.sph-head:hover{background:var(--slate-2)}
.sph-head .dot{width:8px;height:8px;border-radius:50%;flex:none}
.sph-head button.name{flex:1;border:0;background:none;text-align:left;padding:0;font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--slate-ink)}
.sph-head.on{background:var(--slate-2)}
.sph-head.on button.name{color:var(--lime)}
.icon-btn{border:0;background:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--line-2);color:var(--ink)}
.side .icon-btn{color:var(--slate-muted)}
.side .icon-btn:hover{background:var(--slate-line);color:var(--slate-ink)}
.tree{list-style:none;margin:0;padding:0}
.tree .tree{padding-left:8px;border-left:1px solid var(--slate-line);margin-left:12px}
.node-row{display:flex;align-items:center;gap:2px;border-radius:9px;padding-right:4px}
.node-row:hover{background:var(--slate-2)}
.node-row.on{background:var(--slate-2)}
.node-row.on .node-name{color:var(--lime);font-weight:700}
.caret{width:20px;height:24px;border:0;background:none;color:var(--slate-muted);display:grid;place-items:center;flex:none;padding:0}
.caret svg{transition:transform .15s}
.caret.closed svg{transform:rotate(-90deg)}
.caret.leaf{visibility:hidden}
.node-name{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--slate-ink)}
.node-acts{display:flex;gap:0;opacity:0}
.node-row:hover .node-acts,.node-row:focus-within .node-acts,.sph-head:hover .node-acts,.sph-head:focus-within .node-acts{opacity:1}
@media (hover:none){.node-acts{opacity:1}}
.node-row.drop-hover{outline:2px dashed var(--lime);outline-offset:-2px}
.side .hint{color:var(--slate-muted)}

.side-foot{border-top:1px solid var(--slate-line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));font-size:9.5px;color:var(--slate-muted);display:flex;align-items:center;gap:8px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--slate-muted)}
.sync-dot.ok{background:var(--ok)} .sync-dot.busy{background:var(--warn)} .sync-dot.local{background:var(--danger)}

/* Área principal */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{padding-block:10px 6px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.top-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.menu-btn{display:grid;order:3;width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:999px;color:var(--ink)}
.menu-btn:hover{border-color:var(--ink);background:var(--surface)}
.back-home{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:0;border-radius:999px;padding:2px 9px;margin-right:4px}.back-home:hover{filter:brightness(.97)}
.crumb{font-size:9.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:1px}
.title-wrap{flex:0 1 auto;min-width:0;max-width:34%}
.page-title{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.035em;margin:0;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-sub{color:var(--muted);font-size:9.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-sub b{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--pill);padding:2px 10px 2px 8px;font-size:9.5px;font-weight:700;color:var(--ink)}
.page-sub b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.search{position:relative;flex:0 1 260px;min-width:180px;margin-left:auto}
.search input{width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:7px 34px 7px 32px}
.search input:focus{border-color:var(--ink);outline:none}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:9.5px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.capture{display:flex;flex:1 1 320px;min-width:0;order:1}
.capture-box{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--pill);padding:3px 3px 3px 14px;box-shadow:var(--shadow)}
.capture-box:focus-within{border-color:var(--ink)}
.capture-box input{flex:1;min-width:0;border:0;background:none;padding:5px 0;outline:none;font-size:11px}
.capture-cat{flex:none;max-width:44%;font-size:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--pill);padding:4px 8px}
.capture-cat.need{border-color:var(--danger,#c0392b);box-shadow:0 0 0 2px rgba(192,57,43,.18)}
.capture-ctx{font-size:9.5px;color:var(--muted);white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--pill);padding:7px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn,.seg button{justify-content:center;text-align:center}.seg button{display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn.primary:hover{filter:brightness(1.04);border-color:var(--lime)}
.capture-box .btn.primary{border-radius:var(--pill);padding:5px 14px}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:5px 11px;font-size:10px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--pill);overflow:hidden;background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;font-size:10px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;border-radius:var(--pill);font-weight:600}
.seg button.on{background:#6B7A72;color:#FFFFFF}
.quick-nav{flex:none}
.quick-nav button{padding:6px 12px}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:var(--pill);padding:6px 10px;font-size:10px}
.search-note{font-size:9.5px;background:var(--accent-soft);color:var(--accent);padding:4px 12px;border-radius:var(--pill);font-weight:600}

.content{flex:1;overflow:auto;min-height:0;padding-block:6px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* Kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:14px;align-items:start;min-width:min-content}
.board-wrap{overflow-x:auto;margin-inline:-4px;padding:0 4px 8px}
.col{background:var(--surface-2);border:1px solid var(--line-2);border-radius:18px;display:flex;flex-direction:column;min-height:160px}
.col.drag-over{border-color:var(--accent);background:var(--accent-soft)}
.col-head{display:flex;align-items:center;gap:8px;padding:12px 10px 10px 14px}
.col-head h3{margin:0;font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:-.02em;flex:1}
.col-head .bar{width:8px;height:8px;border-radius:50%}
.col-head .cnt{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--pill);padding:0 8px;color:var(--ink)}
.col-body{display:flex;flex-direction:column;gap:8px;padding:0 8px 10px}
.col-body{max-height:max(360px,calc(100vh - 330px));overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.col-body::-webkit-scrollbar{width:9px}.col-body::-webkit-scrollbar-track{background:transparent;margin:2px 0}
.col-body::-webkit-scrollbar-thumb{background:#B4C2B9;border-radius:9px;border:2px solid transparent;background-clip:content-box}
.col-body::-webkit-scrollbar-thumb:hover{background:#8FA397;background-clip:content-box}
.col-foot{flex:none;height:40px}
/* cartões compactos: cabem de 4 a 5 por coluna */
.col-body{gap:6px}
.col .card{padding:7px 10px 8px;gap:3px;border-radius:10px}
.col .card .card-top{min-height:0}
.col .card .code,.col .card .code{font-size:9.5px}
.col .card h4{font-size:11px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.col .card .meta{gap:4px}
.card .card-head{align-items:flex-start;justify-content:space-between;gap:8px}.card .card-head h4{flex:1;min-width:0}.card .card-head .pri{flex:none;margin-top:1px}.col .card .card-head+.meta{margin-top:9px}
.col .card .tag{font-size:9px;padding:1px 7px;line-height:1.35}
.col .card:hover{transform:none}
.col-empty{color:var(--faint);font-size:10px;text-align:center;padding:20px 8px;border:1px dashed var(--line);border-radius:12px}
.done-month{margin-top:6px}.done-month-h{display:flex;align-items:center;gap:6px;width:100%;background:var(--sunk,rgba(0,0,0,.04));border:0;border-radius:10px;padding:6px 9px;font-size:11px;font-weight:700;color:var(--muted);text-align:left}
.done-month-h .cnt{margin-left:auto}.done-month-h:hover{color:var(--ink)}.done-month-b{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.done-month .rows,.done-month-b .row{margin-top:0}
.drawer.ro .dr-body :is(input,select,textarea):disabled{background:transparent;border-color:transparent;color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink);appearance:none;-webkit-appearance:none;padding-left:0;resize:none;background-image:none}
.drawer.ro .dr-body button:disabled{opacity:1}
.drawer.ro .dr-foot .btn:not(.ro-keep){display:none}
.drawer.ro .dr-body input::placeholder,.drawer.ro .dr-body textarea::placeholder{color:transparent}
.drawer .edit-btn{margin-right:6px;white-space:nowrap}
.col-more{font-size:9.5px;color:var(--accent);background:none;border:0;padding:4px;text-align:center;font-weight:600}
.col-add{display:flex;gap:6px}
.col-add input{flex:1;min-width:0;border:1px solid var(--ink);border-radius:10px;padding:8px 10px;background:var(--surface)}

.st-nova{--st:var(--c-nova)} .st-andamento{--st:var(--c-and)} .st-aguardando{--st:var(--c-agu)} .st-concluido{--st:var(--c-con)}
.col-head .bar{background:var(--st)}

.card{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:11px 12px 12px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:7px;position:relative;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(25,32,45,.06),0 10px 24px rgba(25,32,45,.08)}
.card.dragging{opacity:.45}
.card.done h4{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.card-top{display:flex;align-items:center;gap:6px;justify-content:space-between}
.code{font-family:var(--f-mono);font-size:9.5px;color:var(--faint);letter-spacing:.02em}
.card h4{margin:0;font-size:11px;font-weight:600;line-height:1.35;letter-spacing:-.01em;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:var(--pill);background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.pess{background:var(--pess-soft);color:var(--pess);border-color:transparent}
.tag.corp{background:var(--corp-soft);color:var(--corp);border-color:transparent}
.tag.none{border-style:dashed;color:var(--faint);background:none}
.tag.over{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.tag.today{background:var(--danger-soft);color:var(--danger);border-color:transparent;font-weight:700}
.tag.wait{background:var(--pess-soft);color:var(--pess);border-color:transparent}
.tag.stale{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.pri{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.pri i{width:7px;height:7px;border-radius:50%;display:block}
.pri.critica{color:#FFFFFF;background:#DB4479;border-radius:999px;padding:2px 8px 2px 7px} .pri.critica i{background:#FFFFFF}
.pri.alta{color:#D0638C;background:#FFFFFF;border:1px solid #EFA0B4;border-radius:999px;padding:1px 7px 1px 6px} .pri.alta i{background:#EFA0B4}
.pri.media{color:#3E968A} .pri.media i{background:#3E968A}
.pri.baixa{color:#7E8C84} .pri.baixa i{background:#A9B6AE}
.pri.baixa{color:var(--muted)} .pri.baixa i{background:var(--faint)}

/* Lista */
.group{margin-bottom:24px}
.group-h{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:12px;letter-spacing:-.02em;color:var(--ink);font-weight:600;margin:0 0 10px}
.group-h .cnt{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--pill);padding:0 8px}
.rows{background:var(--surface);border:1px solid var(--line-2);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:22px 62px minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line-2);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .t{min-width:0;display:flex;flex-direction:column;gap:4px}
.row .t span.tt{overflow-wrap:anywhere;font-weight:600}
.row.done .tt{color:var(--muted);text-decoration:line-through}
.row-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);background:none;display:grid;place-items:center;padding:0;color:var(--surface)}
.check.on{background:var(--ok);border-color:var(--ok)}
.status-pill{font-size:9.5px;font-weight:600;padding:2px 9px;border-radius:var(--pill);border:1px solid var(--st);color:var(--st);white-space:nowrap}

/* Tabela */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:16px}
table.grid{border-collapse:collapse;width:100%;min-width:1460px;font-size:10.5px}
.grid th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid th button{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
.grid td{border-bottom:1px solid var(--line-2);padding:3px 4px;vertical-align:middle}
.grid tr:hover td{background:var(--surface-2)}
.grid td.code-cell{padding-left:12px;white-space:nowrap}
.grid td.code-cell button{border:0;background:none;padding:2px 0;color:var(--accent);font-family:var(--f-mono);font-size:9.5px;font-weight:500}
.cell{width:100%;box-sizing:border-box;border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 7px;font-size:10.5px}
.cell:hover{border-color:var(--line)}
.cell:focus{border-color:var(--ink);background:var(--surface);outline:none}
.cell.title{min-width:220px;font-weight:600}
.cell.over{color:var(--danger);font-weight:700}
.table-wrap{border-radius:16px;overflow-x:auto;overflow-y:hidden;clip-path:inset(0 round 16px)}
.table-wrap .grid{border-radius:16px}
.table-wrap .grid thead th:first-child{border-top-left-radius:16px}.table-wrap .grid thead th:last-child{border-top-right-radius:16px}
.table-wrap .grid tbody tr:last-child td:first-child{border-bottom-left-radius:16px}.table-wrap .grid tbody tr:last-child td:last-child{border-bottom-right-radius:16px}
.table-wrap .grid tbody tr:last-child td{border-bottom:0}
.tbl-done{margin-top:16px}
.tbl-done-h{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:9px 14px;margin-bottom:8px;font:inherit;font-size:11px;font-weight:700;color:var(--ink);cursor:pointer}
.tbl-done-h .n{font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:500}
.grid tr.mon-h td{background:var(--surface-2);padding:0;border-top:1px solid var(--line)}
.grid tr.mon-h button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:9px 14px;font:inherit;font-size:10.5px;font-weight:700;color:var(--ink);text-align:left;cursor:pointer;position:sticky;left:0}
.grid tr.mon-h .n{font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:500}
table.grid{min-width:2000px}
.grid th:nth-child(1){min-width:74px}.grid th:nth-child(2){min-width:280px}.grid th:nth-child(3){min-width:140px}.grid th:nth-child(4){min-width:118px}.grid th:nth-child(5){min-width:132px}.grid th:nth-child(6){min-width:190px}.grid th:nth-child(7){min-width:240px}.grid th:nth-child(8){min-width:250px}.grid th:nth-child(9){min-width:170px}.grid th:nth-child(10){min-width:130px}.grid th:nth-child(11){min-width:110px}.grid th:nth-child(12){min-width:90px}.grid th:nth-child(13){min-width:84px}.grid th:nth-child(n+14){min-width:140px}
.grid select.cell{padding-right:26px;text-overflow:clip}
.grid td .cell{overflow:visible}

/* Gaveta */
.scrim{position:fixed;inset:0;background:rgba(15,20,30,.32);z-index:40}
.drawer{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));max-height:min(80vh,720px);background:var(--surface);box-shadow:var(--shadow-lg);z-index:41;display:flex;flex-direction:column;border-radius:18px;overflow:hidden}
.drawer .dr-body{min-height:0}
.dr-head{display:flex;align-items:center;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--line-2)}
.dr-head .code{font-size:9.5px;color:var(--ink);font-weight:500}
.stamp{font-family:var(--f-mono);font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:var(--pill);padding:1px 9px;letter-spacing:.04em}
.dr-body{overflow:auto;flex:1;padding:16px 20px 24px;display:flex;flex-direction:column;gap:16px}
.dr-title{width:100%;box-sizing:border-box;border:1px solid transparent;border-radius:10px;padding:4px 8px;margin-left:-8px;font-family:var(--f-display);font-size:17.5px;font-weight:600;line-height:1.2;resize:none;background:none;letter-spacing:-.035em;overflow:hidden}
.dr-title:hover{border-color:var(--line)} .dr-title:focus{border-color:var(--ink);outline:none}
.fields{display:grid;grid-template-columns:120px minmax(0,1fr);gap:9px 12px;align-items:center}
.fields label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.fields input,.fields select,.fields textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:10.5px}
.fields input:focus,.fields select:focus,.fields textarea:focus{border-color:var(--ink);outline:none}
.fields textarea{min-height:90px;resize:vertical}
.fields .full{grid-column:1/-1}
.sec-h{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:700;margin:6px 0 0}
.hist{list-style:none;margin:0;padding:0 0 0 12px;display:flex;flex-direction:column;gap:10px;font-size:10px;border-left:2px solid var(--line-2)}
.hist li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;position:relative}
.hist li::before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--surface);border:2px solid var(--faint)}
.hist li:first-child::before{background:var(--accent);border-color:var(--accent)}
.hist time{font-family:var(--f-mono);font-size:9.5px;color:var(--faint)}
.dr-foot{display:flex;justify-content:space-between;gap:8px;padding:12px 20px;border-top:1px solid var(--line-2)}
.hint{font-size:9.5px;color:var(--muted)}

/* Relatórios e configurações */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:16px 18px}
.tile b{display:block;font-family:var(--f-display);font-size:27px;font-weight:600;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1.05}
.tile span{font-size:9.5px;color:var(--muted)}
.tile.alert b{color:var(--danger)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:16px 18px;min-width:0}
.panel h3{margin:0 0 14px;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:-.025em}
.panel p{margin:0 0 10px;color:var(--muted);font-size:10px;max-width:65ch}
.hbar{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:10px;margin-bottom:8px}
.hbar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:10px;background:var(--surface-2);border-radius:var(--pill);overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:var(--pill)}
.hbar .v{font-family:var(--f-mono);font-size:9.5px;text-align:right;color:var(--muted)}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;height:150px;padding-top:16px;border-bottom:1px solid var(--line)}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.wk .b{width:100%;max-width:30px;background:var(--ok);border-radius:8px 8px 0 0;min-height:2px}
.wk .n{font-family:var(--f-mono);font-size:9.5px;color:var(--muted)}
.wk-l{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;font-family:var(--f-mono);font-size:9.5px;color:var(--faint);text-align:center;margin-top:5px}
.set-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-2);flex-wrap:wrap}
.set-row:first-of-type{border-top:0}
.set-row .grow{flex:1;min-width:160px}
.toggle{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-2)}
.toggle input[type=checkbox]{margin-top:3px;accent-color:var(--ok)}

/* Sobreposições */
.modal-scrim{position:fixed;inset:0;background:rgba(15,20,30,.38);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);padding:20px;width:min(400px,100%);display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-family:var(--f-display);font-size:14.5px;font-weight:600;letter-spacing:-.03em}
.modal p{margin:0;color:var(--muted);font-size:10.5px}
.modal input{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface)}
.modal input:focus{border-color:var(--ink);outline:none}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--pill);font-size:10.5px;font-weight:600;z-index:70;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px);display:flex;gap:8px;align-items:center}
.banner{background:var(--warn-soft);color:var(--warn);font-size:10px;padding:9px 14px;border-radius:12px;margin-bottom:12px}
.loading{color:var(--muted);padding:40px 0;text-align:center}
.empty-big{text-align:center;color:var(--muted);padding:56px 16px}
.empty-big b{display:block;font-family:var(--f-display);font-size:17.5px;letter-spacing:-.04em;color:var(--ink);margin-bottom:6px;font-weight:600}

/* Relatórios */
.rep-bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.rep-bar label{display:flex;flex-direction:column;gap:4px;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.rep-bar select{min-width:180px;max-width:100%}
.rep-bar .grow{flex:1}
.rep-scope{font-size:10px;color:var(--muted);margin:-6px 0 14px}
.rep-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;margin-bottom:16px}
table.rep{border-collapse:collapse;width:100%;min-width:760px;font-size:10.5px}
.rep th{background:var(--surface-2);text-align:right;font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.rep th:first-child{text-align:left}
.rep td{padding:7px 10px;border-bottom:1px solid var(--line-2);text-align:right;font-family:var(--f-mono);font-size:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rep td:first-child{text-align:left;font-family:var(--f-body);font-size:10.5px;white-space:normal}
.rep tr.lvl0 td{font-weight:700;background:var(--surface-2)}
.rep tr.lvl0 td:first-child{font-family:var(--f-display)}
.rep tr.total td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.rep tr[data-scope]{cursor:pointer}
.rep tr[data-scope]:hover td{background:var(--accent-soft)}
.rep .zero{color:var(--faint)}
.rep .over{color:var(--danger);font-weight:700}
.rep-bar input[type=date]{min-width:0}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:150px;padding-top:16px;border-bottom:1px solid var(--line)}
.mo{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%}
.mo i{display:block;width:42%;max-width:12px;border-radius:4px 4px 0 0;min-height:2px}
.mo i.in{background:var(--accent)} .mo i.out{background:var(--ok)}
.mo-l{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;font-family:var(--f-mono);font-size:9.5px;color:var(--faint);text-align:center;margin-top:5px}
.legend{display:flex;gap:14px;font-size:10px;color:var(--muted);margin-bottom:6px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;background:var(--c)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:96px 58px minmax(0,1fr);gap:10px;padding:7px 4px;border-top:1px solid var(--line-2);font-size:10.5px;cursor:pointer;align-items:baseline}
.log li:first-child{border-top:0}
.log li:hover{background:var(--surface-2)}
.log time{font-family:var(--f-mono);font-size:9.5px;color:var(--faint)}
.log .what{min-width:0}
.log .what b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .what span{color:var(--muted)}
.panel.wide{grid-column:1/-1}
/* Visão geral */
.ov-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:10px;color:var(--muted);margin:-4px 0 14px}
.ov-legend span{display:inline-flex;align-items:center;gap:6px}
.ov-legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.ov-legend b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.ov-group{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:700;margin:12px 0 6px}
.ov-group:first-of-type{margin-top:0}
.ov-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 92px;gap:12px;align-items:center;padding:4px 6px;margin:0 -6px;border-radius:10px}
.ov-row[data-scope]{cursor:pointer}
.ov-row[data-scope]:hover{background:var(--surface-2)}
.ov-row .l{font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-track{display:flex;gap:2px;height:18px;min-width:0}
.ov-seg{height:100%;background:var(--c);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-mono);font-size:9.5px;min-width:3px;overflow:hidden}
.ov-seg:first-child{border-radius:4px 0 0 4px} .ov-seg:last-child{border-radius:0 4px 4px 0} .ov-seg:only-child{border-radius:4px}
.ov-empty{height:18px;border:1px dashed var(--line);border-radius:4px;flex:1}
.ov-row .v{font-family:var(--f-mono);font-size:10px;text-align:right;white-space:nowrap}
.ov-row .v em{font-style:normal;color:var(--danger);font-weight:700;display:block;font-size:9.5px}
.ov-tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--surface);font-size:10px;padding:6px 9px;border-radius:8px;box-shadow:var(--shadow-lg);white-space:nowrap}
.ov-table summary{cursor:pointer;font-size:10px;color:var(--accent);margin-top:10px;font-weight:600}
@media (max-width:600px){.ov-row{grid-template-columns:minmax(0,1fr) 70px}.ov-row .ov-track{grid-column:1/-1;grid-row:2}}
.tag.exec{background:#6B7A72;color:#FFFFFF;border-color:transparent;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em}
.tag.resp{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.me-row{display:flex;align-items:center;gap:8px;padding:2px 8px 6px;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:700}
.me-row select{flex:1;min-width:0;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.people-pick{display:flex;flex-wrap:wrap;gap:6px}
.people-pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:10.5px;display:inline-flex;align-items:center;gap:6px}
.people-pick button.on{background:var(--accent);border-color:var(--accent);color:var(--lime-ink);font-weight:600}
.people-pick button:hover{border-color:var(--ink)}
/* Checklist */
.ck-head{display:flex;align-items:center;gap:10px}
.ck-head .sec-h{margin:0}
.ck-bar{flex:1;height:6px;border-radius:999px;background:var(--line-2);overflow:hidden}
.ck-bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .2s}
.ck-count{font-family:var(--f-mono);font-size:9.5px;color:var(--muted)}
.ck-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.ck-item{display:flex;align-items:center;gap:8px;border-radius:10px;padding:2px 4px}
.ck-item:hover{background:var(--surface-2)}
.ck-item input[type=text]{flex:1;min-width:0;border:1px solid transparent;background:none;border-radius:8px;padding:5px 6px;font-size:10.5px}
.ck-item input[type=text]:hover{border-color:var(--line)}
.ck-item input[type=text]:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.ck-item.done input[type=text]{color:var(--muted);text-decoration:line-through}
.ck-item .icon-btn{opacity:0}
.ck-item:hover .icon-btn,.ck-item:focus-within .icon-btn{opacity:1}
@media (hover:none){.ck-item .icon-btn{opacity:1}}
.ck-add{display:flex;gap:8px;margin-top:6px}
.ck-add input{flex:1;min-width:0;border:1px dashed var(--line);border-radius:10px;padding:7px 10px;background:none;font-size:10.5px}
.ck-add input:focus{border-style:solid;border-color:var(--accent);outline:none;background:var(--surface)}
.ck-done-note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:7px 10px;font-size:10.5px;font-weight:600}
.tag.ck-full{background:var(--ok-soft);color:var(--ok);border-color:transparent}
/* Anexos e tempo */
.attach-list{display:flex;flex-direction:column;gap:6px}
.att{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:12px;padding:6px 8px;background:var(--surface-2);min-width:0}
.att .thumb{width:36px;height:36px;border-radius:9px;object-fit:cover;flex:none;background:var(--line-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.att a{flex:1;min-width:0;color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.att a:hover{text-decoration:underline}
.att small{color:var(--faint);font-size:9.5px;white-space:nowrap;font-family:var(--f-mono)}
.att-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.dropzone{border-radius:14px;padding:2px}
.dropzone.over{outline:2px dashed var(--accent);outline-offset:4px;background:var(--accent-soft)}
.time-box{border:1px solid var(--line-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.time-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;flex:1;min-width:120px}
.clock.run{color:var(--ok)}
.time-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.time-grid div{font-size:9.5px;color:var(--muted)}
.time-grid b{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--ink);font-weight:500;margin-top:2px}
.sess{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--line-2);font-size:9.5px;display:flex;flex-direction:column;gap:2px}
.sess li{display:flex;gap:10px;align-items:center}
.sess li span:nth-child(2){flex:1}
.sess .mono{color:var(--faint);font-size:9.5px}
.tag.timer{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag svg{flex:none}
.dur-cell{font-family:var(--f-mono);font-size:9.5px;color:var(--muted);white-space:nowrap;padding:0 8px!important}

        <div class="toolbar" id="toolbar"></div>
        <label class="search" for="q">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Buscar em todas as demandas" autocomplete="off">
          <kbd>/</kbd>
        </label>
      </div>
    </header>
    <section class="content" id="content"><div class="loading">Carregando demandas…</div></section>
  </main>
</div>
<div id="drawerHost"></div>
<div id="modalHost"></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const pad4=n=>String(n).padStart(4,'0');

const STATUSES=[{id:'nova',label:'A fazer'},{id:'andamento',label:'Em andamento'},{id:'aguardando',label:'Aguardando'},{id:'concluido',label:'Concluído'}];
const ST=Object.fromEntries(STATUSES.map(s=>[s.id,s.label]));
const PRI={critica:{label:'Crítica',rank:0},alta:{label:'Alta',rank:1},media:{label:'Média',rank:2},baixa:{label:'Baixa',rank:3}};
const SPH={pessoal:'Pessoal',corporativo:'Corporativo'};
const EXEC={fernando:{label:'Fernando Shayer',short:'FS'},leticia:{label:'Leticia Lyle',short:'LL'},ambos:{label:'Fernando Shayer e Leticia Lyle',short:'FS + LL'}};
const EXEC_FILTERS=[['','Todos os executivos'],['fernando','Fernando Shayer'],['leticia','Leticia Lyle'],['ambos','Só as dos dois'],['none','Sem executivo']];
function execMatch(t,f){if(!f)return true;const e=t.executive||null;if(f==='none')return !e;if(f==='ambos')return e==='ambos';return e===f||e==='ambos';}
function execOptions(cur,empty){return '<option value="">'+(empty||'Sem executivo')+'</option>'+Object.keys(EXEC).map(k=>'<option value="'+k+'"'+(cur===k?' selected':'')+'>'+EXEC[k].label+'</option>').join('');}
const KINDS={
  email:{label:'Follow-up de e-mail',short:'E-mail',plural:'e-mails'},
  impressao:{label:'Impressão',short:'Impressão',plural:'impressões'},
  assinatura:{label:'Solicitação de assinatura',short:'Assinatura',plural:'assinaturas'},
  certificado:{label:'Certificado digital',short:'Certificado',plural:'certificados'},
  familia:{label:'Atendimento a família',short:'Família',plural:'famílias'}};
const KFL={representante:'Representante legal',familia:'Família ou aluno',canal:'Canal',recebeu:'Contato com',contatoEm:'Contato em',pedeAg:'Pediu agendamento',dataAg:'Data da reunião',horaAg:'Horário da reunião',empresa:'Empresa',de:'De quem',link:'Link do e-mail',qtd:'Quantidade',solic:'Solicitante',modo:'Tipo de assinatura',quem:'Em nome de',pedidoPor:'Quem pediu',pedidoVia:'Pedido feito por',pedidoLink:'Prova do pedido',autoriz:'Autorização',docLink:'Documento',plataforma:'Plataforma',etapa:'Etapa da assinatura',assinadoEm:'Assinado em',comprov:'Comprovante',devolvido:'Devolvido a',titular:'Titular',tipoCert:'Tipo de certificado',renov:'Renovação'};
const KS_EMP=['Todas as empresas','Camino School','Seeds','Mindset','Mistaria','Serengetti','Chase Growth Education'];
function empList(){try{const c=window.parent&&window.parent.CE;const l=c&&c.empresas&&c.empresas();if(l&&l.length)return l;}catch(e){}return KS_EMP.filter(x=>x!=='Todas as empresas').map(n=>({id:n,nome:n,pai:''}));}
const empNorm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function empKey(v){if(!v)return '';if(v==='todas'||v==='Todas as empresas')return 'todas';const l=empList();if(l.some(e=>e.id===v))return v;const m=l.find(e=>empNorm(e.nome)===empNorm(v));return m?m.id:v;}
function empName(v){const k=empKey(v);if(k==='todas')return 'Todas as empresas';const e=empList().find(x=>x.id===k);return e?e.nome:(v||'');}
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DIAS=['dom','seg','ter','qua','qui','sex','sáb'];

let tasks=new Map();
let cats=[];
const DEFAULT_PEOPLE=[{id:'denise',name:'Denise'},{id:'keyte',name:'Keyte'},{id:'tatiana',name:'Tatiana'}];
let settings={fields:[],people:DEFAULT_PEOPLE.slice(),auto:{askWaiting:true,staleDays:3,raiseOnDue:false,autoTimer:false}};
const people=()=>settings.people||[];
const personName=id=>{const p=people().find(x=>x.id===id);return p?p.name:'(removida)';};
const assigneesOf=t=>(t.assignees||[]).filter(Boolean);
const assigneesLabel=t=>assigneesOf(t).map(personName).join(', ');
function respMatch(t,f){if(!f)return true;const a=assigneesOf(t);if(f==='none')return !a.length;return a.includes(f);}
const respFilters=()=>[['','Todos os responsáveis']].concat(people().map(p=>[p.id,p.name]),[['none','Sem responsável']]);
let loaded={tasks:false,cats:false,settings:false};
let ui={tblDone:false,tblMon:{},view:'inbox',node:null,sphere:null,q:'',fSt:'',fPri:'',fSph:'',fExec:'',fResp:'',me:'',sort:{key:'createdAt',dir:1},openId:null,focusField:null,colAdd:null,collapsed:{},modes:{},showAllDone:false,armDelete:false,fKind:'',fEmp:'',ks:null};
try{ui.me=localStorage.getItem('cs-me')||'';}catch(e){}
try{const s=JSON.parse(localStorage.getItem('cs-ui')||'{}');if(s.modes)ui.modes=s.modes;if(s.collapsed)ui.collapsed=s.collapsed;}catch(e){}
function saveUi(){try{localStorage.setItem('cs-ui',JSON.stringify({modes:ui.modes,collapsed:ui.collapsed}))}catch(e){}}

/* ---------- datas ---------- */
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function fmtDate(iso,withDow){if(!iso)return '';const t=todayISO();if(iso===t)return 'Hoje';if(iso===addDays(t,1))return 'Amanhã';if(iso===addDays(t,-1))return 'Ontem';const d=new Date(iso+'T12:00:00');let s=d.getDate()+' '+MESES[d.getMonth()];if(d.getFullYear()!==new Date().getFullYear())s+=' '+d.getFullYear();return withDow?DIAS[d.getDay()]+', '+s:s;}
function fmtStamp(ts){if(!ts)return '';const d=new Date(ts);return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());}
function fmtStampLong(ts){if(!ts)return '—';const d=new Date(ts);return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear()+' às '+pad2(d.getHours())+':'+pad2(d.getMinutes());}
function daysBetween(a,b){return Math.floor((new Date(b)-new Date(a))/86400000);}
const isOpen=t=>t.status!=='concluido';
const isOverdue=t=>isOpen(t)&&t.due&&t.due<todayISO();
function statusLogOf(t){if(t.statusLog&&t.statusLog.length)return t.statusLog;const log=[{s:'nova',at:t.createdAt}];if(t.status!=='nova')log.push({s:t.status,at:t.status==='concluido'?(t.completedAt||t.updatedAt):t.status==='aguardando'?(t.waitingSince||t.updatedAt):t.updatedAt});return log;}
function timeInStatus(t){const out={nova:0,andamento:0,aguardando:0,concluido:0};const log=statusLogOf(t);for(let i=0;i<log.length;i++){const s=log[i].s;if(s==='concluido'||!(s in out))continue;const end=i+1<log.length?new Date(log[i+1].at):new Date();out[s]+=Math.max(0,end-new Date(log[i].at));}return out;}
function intervalsOf(t,st){const log=statusLogOf(t);const out=[];for(let i=0;i<log.length;i++){if(log[i].s!==st)continue;const a=new Date(log[i].at),b=i+1<log.length?new Date(log[i+1].at):new Date();if(b>a)out.push([a,b]);}return out;}
function workedMs(t){return intervalsOf(t,'andamento').reduce((n,[a,b])=>n+(b-a),0);}
function workedSince(t,since){return intervalsOf(t,'andamento').reduce((n,[a,b])=>{const s0=Math.max(+a,since);return n+Math.max(0,b-s0);},0);}
function cycleMs(t){return Math.max(0,(t.completedAt?new Date(t.completedAt):new Date())-new Date(t.createdAt));}
function fmtDur(ms){if(!ms||ms<0)return '—';const mins=Math.round(ms/60000);if(mins<1)return '< 1 min';const d=Math.floor(mins/1440),h=Math.floor(mins%1440/60),m=mins%60;if(d)return d+' d'+(h?' '+h+' h':'');if(h)return h+' h'+(m?' '+m+' min':'');return m+' min';}
function fmtClock(ms){const s=Math.floor(ms/1000);return pad2(Math.floor(s/3600))+':'+pad2(Math.floor(s%3600/60))+':'+pad2(s%60);}
function parseDur(str){const s=String(str).trim().toLowerCase().replace(',','.');let m;if((m=s.match(/^(\d+(?:\.\d+)?)\s*h(?:oras?)?\s*(?:(\d+)\s*(?:m|min|minutos?)?)?$/)))return Math.round(parseFloat(m[1])*60+(+m[2]||0));if((m=s.match(/^(\d+):(\d{1,2})$/)))return (+m[1])*60+(+m[2]);if((m=s.match(/^(\d+)\s*(?:m|min|minutos?)?$/)))return +m[1];return null;}
function fmtSize(b){if(!b&&b!==0)return '';if(b<1024)return b+' B';if(b<1048576)return Math.round(b/1024)+' KB';return (b/1048576).toFixed(1).replace('.',',')+' MB';}
const extOf=n=>{const e=(String(n).split('.').pop()||'').slice(0,4);return e&&e!==n?e:'arq';};
const isStale=t=>t.status==='aguardando'&&t.waitingSince&&daysBetween(t.waitingSince,new Date())>=(+settings.auto.staleDays||3);

/* ---------- categorias ---------- */
const catById=id=>cats.find(c=>c.id===id);
function catPath(id){const out=[];let n=catById(id),g=0;while(n&&g++<20){out.unshift(n);n=catById(n.parentId);}return out;}
function children(pid,sphere){return cats.filter(c=>(c.parentId||null)===(pid||null)&&(pid||c.sphere===sphere)).sort((a,b)=>(a.order??0)-(b.order??0)||a.name.localeCompare(b.name,'pt'));}
function descendants(id){const set=new Set([id]);let added=true;while(added){added=false;for(const c of cats){if(c.parentId&&set.has(c.parentId)&&!set.has(c.id)){set.add(c.id);added=true;}}}return set;}
function classLabel(t){if(t.categoryId&&catById(t.categoryId))return catPath(t.categoryId).map(c=>c.name).join(' › ');return 'Sem classificação';}
function hasCat(t){return !!(t.categoryId&&catById(t.categoryId));}
const AREA_MOD={'p-fin':'fin','p-dp':'dp','p-fac':'fac','p-sau':'sau','p-neg':'neg','p-age':'age'};
const NB='\u00a0\u00a0';
function sphereOf(t){if(t.categoryId&&catById(t.categoryId))return catById(t.categoryId).sphere;return t.sphere||null;}

/* ---------- persistência ---------- */
let db=null,mode='loading',pending=0,assetsNs=null,uploading=0,failed=0;
const CEd=()=>{try{const c=window.parent&&window.parent.CE;return c&&typeof c.driveUpload==='function'?c:null;}catch(e){return null;}};
let driveOn=false;try{const c=CEd();if(c)c.driveOk().then(v=>{driveOn=!!v;if(typeof renderDrawer==='function')renderDrawer();}).catch(()=>{});}catch(e){}
const LS='central-secretariado-v1';
const queues={};
function setSync(){const dot=$('#syncDot'),tx=$('#syncText');dot.className='sync-dot';
  if(mode==='db'){if(pending>0){dot.classList.add('busy');tx.textContent='Salvando…';}else if(failed){dot.classList.add('local');tx.textContent='Algo não foi salvo. Tente de novo.';}else{dot.classList.add('ok');tx.textContent='Tudo salvo na nuvem';}}
  else if(mode==='local'){dot.classList.add('local');tx.textContent='Salvo só neste navegador';}
  else tx.textContent='Conectando…';}
function enqueue(key,fn){pending++;setSync();const p=(queues[key]||Promise.resolve()).then(fn).then(()=>{failed=0;}).catch(e=>{failed++;console.warn('save failed',key,e);toast(e&&e.code==='quota_exceeded'?'Limite de armazenamento atingido. Exclua demandas antigas para liberar espaço.':'Não foi possível salvar agora. Tente de novo em instantes.');}).finally(()=>{pending--;setSync();});queues[key]=p;return p;}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({tasks:[...tasks.values()],cats,settings}));}catch(e){}}
function persistTask(t){tasks.set(t.id,t);render();if(mode==='db')enqueue('t/'+t.id,()=>db.doc('tasks/'+t.id).set(t));else lsSave();}
function removeTask(id){tasks.delete(id);render();if(mode==='db')enqueue('t/'+id,()=>db.doc('tasks/'+id).delete());else lsSave();}
function persistCats(){render();if(mode==='db')enqueue('cats',()=>db.doc('meta/categories').set({nodes:cats}));else lsSave();}
function persistSettings(){render();if(mode==='db')enqueue('settings',()=>db.doc('meta/settings').set(settings));else lsSave();}

async function boot(){
  let ns=null;
  try{if(window.claude&&typeof window.claude.use==='function')ns=await window.claude.use('db');}catch(e){ns=null;}
  if(ns){db=ns;mode='db';setSync();
    try{window.claude.use('assets').then(a=>{assetsNs=a||null;renderDrawer();}).catch(()=>{});}catch(e){}
    db.collection('tasks').onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>{const v=d.data();if(v)m.set(d.id,{...v,id:d.id});});tasks=m;loaded.tasks=true;render();},err=>{toast('A conexão com os dados caiu. Recarregue a página.');});
    db.doc('meta/categories').onSnapshot(s=>{cats=s.exists?JSON.parse(JSON.stringify((s.data()||{}).nodes||[])):[];loaded.cats=true;render();},()=>{});
    db.doc('meta/settings').onSnapshot(s=>{if(s.exists){const v=JSON.parse(JSON.stringify(s.data()||{}));settings={fields:v.fields||[],people:Array.isArray(v.people)?v.people:DEFAULT_PEOPLE.slice(),auto:Object.assign({askWaiting:true,staleDays:3,raiseOnDue:false,autoTimer:false},v.auto||{})};}loaded.settings=true;render();},()=>{});
  }else{
    mode='local';setSync();
    let s=null;try{s=JSON.parse(localStorage.getItem(LS)||'null');}catch(e){}
    if(s){(s.tasks||[]).forEach(t=>tasks.set(t.id,t));cats=s.cats||[];if(s.settings)settings=s.settings;}
    loaded={tasks:true,cats:true,settings:true};render();
  }
}

/* ---------- tarefas ---------- */
function nextNum(){let m=0;for(const t of tasks.values())if((t.num||0)>m)m=t.num;return m+1;}
function contextPreset(){const p={};
  if(ui.view==='node'&&catById(ui.node)){p.categoryId=ui.node;p.sphere=catById(ui.node).sphere;}
  else if(ui.view==='sphere'&&ui.sphere)p.sphere=ui.sphere;
  else if(ui.view==='waiting')p.status='aguardando';
  else if(ui.view==='mine'&&ui.me)p.assignees=[ui.me];
  else if(ui.view==='upcoming')p.due=todayISO();
  return p;}
function contextLabel(){const p=contextPreset();const bits=[];if(p.categoryId)bits.push(catPath(p.categoryId).map(c=>c.name).join(' › '));if(p.status)bits.push(ST[p.status]);if(p.due)bits.push('prazo hoje');if(p.assignees)bits.push('atribuída a '+personName(p.assignees[0]));return bits.length?'em '+bits.join(' · '):'na Operação';}
function isSub(id){const n=id&&catById(id);return !!(n&&n.parentId);}
function subGroups(sel,pre){let h='';for(const r of cats.filter(c=>!c.parentId).sort((a,b)=>(a.order??0)-(b.order??0))){h+='<optgroup label="'+esc(r.name)+'">';
  const walk=(pid,d)=>{for(const n of children(pid)){h+='<option value="'+pre+n.id+'"'+(sel===n.id?' selected':'')+'>'+NB.repeat(d)+esc(n.name)+'</option>';walk(n.id,d+1);}};walk(r.id,0);
  h+='<option value="new:'+r.id+'">+ Nova subcategoria em '+esc(r.name)+'…</option></optgroup>';}return h;}
function qcatOptions(sel){sel=isSub(sel)?sel:'';return '<option value="" disabled'+(sel?'':' selected')+'>Subcategoria…</option>'+subGroups(sel,'');}
async function newSubFrom(rootId){const r=catById(rootId);if(!r)return null;
  const name=await ask({title:'Nova subcategoria em '+r.name,placeholder:'Nome da subcategoria',ok:'Criar'});if(!name)return null;
  const ex=cats.find(c=>c.parentId===rootId&&c.name.trim().toLowerCase()===name.trim().toLowerCase());if(ex)return ex.id;
  const n={id:newCatId(),name:name.trim(),sphere:r.sphere,parentId:rootId,order:children(rootId).length};
  cats=cats.concat([n]);persistCats();toast('Subcategoria “'+n.name+'” criada');return n.id;}
function fillQcat(){const el=$('#qcat');if(!el)return;if(ui.view==='node'&&catById(ui.node)&&!(isSub(ui.qcat)&&descendants(ui.node).has(ui.qcat)))ui.qcat=ui.node;if(ui.qcat&&!catById(ui.qcat))ui.qcat='';
  el.innerHTML=qcatOptions(ui.qcat||'');el.classList.remove('need');}
function needCat(p){return needCatOld(p);}
function needCatOld(p){const id=[p.categoryId,ui.qcat,$('#qcat')&&$('#qcat').value].find(isSub);if(!id){const el=$('#qcat');if(el){el.classList.add('need');el.focus();}toast('Escolha a subcategoria da demanda.');return null;}
  p.categoryId=id;p.sphere=catById(id).sphere;return p;}
function newTask(title,preset){
  const now=new Date().toISOString();
  const id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const num=nextNum();
  const t=Object.assign({id,num,title:title.trim(),status:'nova',sphere:null,categoryId:null,priority:null,executive:null,assignees:[],delegatedAt:null,due:null,waitingFor:'',notes:'',fields:{},attachments:[],checklist:[],sessions:[],timerStart:null,createdAt:now,updatedAt:now,completedAt:null,waitingSince:null},preset||{});
  if(t.status==='aguardando')t.waitingSince=now;
  if((t.assignees||[]).length)t.delegatedAt=now;
  if(t.status==='concluido')t.completedAt=now;
  t.statusLog=[{s:t.status,at:now}];
  t.history=[{at:now,text:'Demanda registrada'+(t.categoryId||t.sphere?' em '+classLabel(t):'')}];
  persistTask(t);toast('D-'+pad4(num)+' registrada');return t;}
function fmtVal(v){return v===null||v===undefined||v===''?'vazio':String(v);}
function describe(k,a,b){
  switch(k){
    case 'title':return 'Título alterado';
    case 'status':return 'Status: '+(ST[a]||'—')+' → '+(ST[b]||'—');
    case 'priority':return 'Prioridade: '+(a?PRI[a].label:'sem')+' → '+(b?PRI[b].label:'sem');
    case 'due':return 'Prazo: '+(a?fmtDate(a):'sem prazo')+' → '+(b?fmtDate(b):'sem prazo');
    case 'waitingFor':return 'Aguardando: '+fmtVal(a)+' → '+fmtVal(b);
    case 'assignees':return 'Responsáveis: '+((a||[]).map(personName).join(', ')||'nenhum')+' → '+((b||[]).map(personName).join(', ')||'nenhum');
    case 'executive':return 'Executivo: '+(a?EXEC[a].label:'nenhum')+' → '+(b?EXEC[b].label:'nenhum');
    case 'notes':return 'Observações atualizadas';
    case 'reportRel':return b?'Marcada como relevante para o executivo':'Desmarcada como relevante para o executivo';
    case 'needsExec':return b?'Marcada como “precisa do executivo”':'Desmarcada de “precisa do executivo”';
    default:return k+' alterado';}}
const SILENT=new Set(['timerStart','sessions','attachments','statusLog','checklist']);
function updateTask(id,patch,extra){
  const old=tasks.get(id);if(!old)return;
  const t=JSON.parse(JSON.stringify(old));const now=new Date().toISOString();const notes=[];
  const oldClass=classLabel(old);
  for(const k of Object.keys(patch)){const v=patch[k];
    if(k==='fields'){for(const fk of Object.keys(v)){const cur=(t.fields||{})[fk];if((cur??'')!==(v[fk]??'')){const def=settings.fields.find(f=>f.id===fk);notes.push((def?def.name:(KFL[fk]||'Campo'))+': '+fmtVal(cur)+' → '+fmtVal(v[fk]));t.fields=Object.assign({},t.fields,{[fk]:v[fk]});}}continue;}
    if(SILENT.has(k)){t[k]=v;continue;}
    if(JSON.stringify(t[k]??null)===JSON.stringify(v??null))continue;
    if(k!=='sphere'&&k!=='categoryId')notes.push(describe(k,t[k],v));
    t[k]=v;}
  if('categoryId' in patch){const n=catById(t.categoryId);if(n)t.sphere=n.sphere;}
  if('sphere' in patch&&!('categoryId' in patch)){const n=catById(t.categoryId);if(n&&n.sphere!==t.sphere)t.categoryId=null;}
  const newClass=classLabel(t);if(newClass!==oldClass)notes.push('Classificação: '+oldClass+' → '+newClass);
  if(extra)notes.push(...extra);
  if(!notes.length)return;
  if('status' in patch&&patch.status!==old.status){
    t.completedAt=patch.status==='concluido'?now:null;
    t.waitingSince=patch.status==='aguardando'?now:null;
    t.statusLog=statusLogOf(old).concat([{s:patch.status,at:now}]).slice(-200);
    const stop=label=>{t.sessions=(t.sessions||[]).concat([{start:t.timerStart,end:now}]);t.timerStart=null;notes.push(label);};
    if(patch.status==='concluido'&&t.timerStart)stop('Cronômetro pausado ao concluir');
    else if(settings.auto.autoTimer){
      if(patch.status==='andamento'&&!t.timerStart){t.timerStart=now;notes.push('Automação: cronômetro iniciado');}
      else if(old.status==='andamento'&&t.timerStart)stop('Automação: cronômetro pausado ao sair de Em andamento');}}
  if(settings.auto.raiseOnDue&&todayISO()>=SLA_PAUSE_END&&'due' in patch&&t.due&&t.due<=todayISO()&&t.priority!=='alta'&&t.priority!=='critica'&&isOpen(t)){t.priority='alta';notes.push('Automação: prioridade elevada para Alta (prazo vencendo)');}
  if('assignees' in patch&&JSON.stringify(old.assignees||[])!==JSON.stringify(t.assignees||[]))t.delegatedAt=(t.assignees||[]).length?now:null;
  t.updatedAt=now;
  t.history=(t.history||[]).concat(notes.map(text=>({at:now,text}))).slice(-150);
  persistTask(t);
  if(patch.status==='aguardando'&&old.status!=='aguardando'&&settings.auto.askWaiting&&!t.waitingFor){openDrawer(id,'f-waiting');toast('De quem ou do que esta demanda depende?');}
}

function periodRange(p){const now=new Date();let from=new Date(0),to=now;
  if(p==='7'||p==='30'||p==='90')from=new Date(now-(+p)*86400000);
  else if(p==='month')from=new Date(now.getFullYear(),now.getMonth(),1);
  else if(p==='prev'){from=new Date(now.getFullYear(),now.getMonth()-1,1);to=new Date(now.getFullYear(),now.getMonth(),1);}
  else if(p==='year')from=new Date(now.getFullYear(),0,1);
  else if(p==='lastyear'){from=new Date(now.getFullYear()-1,0,1);to=new Date(now.getFullYear(),0,1);}
  else if(p==='custom'){const f=ui.rep.from||addDays(todayISO(),-30),t=ui.rep.to||todayISO();from=new Date(f+'T00:00:00');to=new Date(addDays(t,1)+'T00:00:00');if(to>now)to=now;if(from>to)from=new Date(to-86400000);}
  return [from,to];}
function statusAt(t,date){if(new Date(t.createdAt)>date)return null;const log=statusLogOf(t);let st=log[0]?log[0].s:t.status;for(const e of log){if(new Date(e.at)<=date)st=e.s;else break;}return st;}
const isoOf=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
function endLabel(r){return Math.abs(Date.now()-r[1])<60000?'agora':'em '+stampBR(new Date(r[1]-1)).slice(0,10);}
const inRange=(iso,r)=>{if(!iso)return false;const d=new Date(iso);return d>=r[0]&&d<r[1];};
function workedBetween(t,r){return intervalsOf(t,'andamento').reduce((n,[a,b])=>n+Math.max(0,Math.min(+b,+r[1])-Math.max(+a,+r[0])),0);}
function scopeTest(sc){if(sc==='all')return ()=>true;if(sc.startsWith('s:')){const sp=sc.slice(2);return t=>sphereOf(t)===sp;}if(sc.startsWith('c:')){const set=descendants(sc.slice(2));return t=>set.has(t.categoryId);}if(sc==='none')return t=>!hasCat(t);return ()=>true;}
function scopeLabel(sc){if(sc==='all')return 'Todas as demandas';if(sc==='none')return 'Sem classificação';if(sc.startsWith('s:'))return SPH[sc.slice(2)];const p=catPath(sc.slice(2));return p.length?p.map(c=>c.name).join(' › '):'Categoria';}

  return h+'<option value="none"'+(cur==='none'?' selected':'')+'>Sem classificação</option>';}
function reportRows(sc){const rows=[];
  const add=(label,path,level,test,drill)=>rows.push({label,path,level,test,drill});
  const walk=(pid,sp,level,prefix)=>{for(const n of children(pid,sp)){const set=descendants(n.id);add(n.name,(prefix?prefix+' › ':'')+n.name,level,t=>set.has(t.categoryId),'c:'+n.id);walk(n.id,sp,level+1,(prefix?prefix+' › ':'')+n.name);}};

  if(sc==='all'){walk(null,'pessoal',0,'');walk(null,'corporativo',0,'');add('Sem classificação','Sem classificação',0,t=>!hasCat(t),'none');}

function metrics(list,r){const end=new Date(r[1]-1);const endIso=isoOf(end);const snap=list.map(t=>[t,statusAt(t,end)]).filter(x=>x[1]);const done=list.filter(t=>inRange(t.completedAt,r));const cyc=done.map(cycleMs);const wk=done.map(workedMs).filter(x=>x>0);

/* ---------- SLA: tempo de resolução em dias úteis ---------- */
const _hol={};
function holidaysOf(y){if(_hol[y])return _hol[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  const ea=new Date(y,mo-1,da);const rel=n=>{const x=new Date(ea);x.setDate(ea.getDate()+n);return x;};
  const key=x=>pad2(x.getMonth()+1)+'-'+pad2(x.getDate());
  /* Feriados de São Paulo (capital): nacionais + 25/01 (cidade), 09/07 (estado), Sexta-feira Santa e Corpus Christi (cidade); segunda e terça de Carnaval (folga da equipe) */
  const days=['01-01','01-25','04-21','05-01','07-09','09-07','10-12','11-02','11-15','11-20','12-25'].map(k=>new Date(y,+k.slice(0,2)-1,+k.slice(3))).concat([rel(-48),rel(-47),rel(-2),rel(60)]);
  const set=new Set(days.map(key));
  /* Emendas: feriado na terça emenda a segunda; na quinta, emenda a sexta */
  days.forEach(d=>{const w=d.getDay();if(w===2||w===4){const x=new Date(d);x.setDate(d.getDate()+(w===2?-1:1));set.add(key(x));}});
  return _hol[y]=set;}
function isBiz(d){const w=d.getDay();if(w===0||w===6)return false;return !holidaysOf(d.getFullYear()).has(pad2(d.getMonth()+1)+'-'+pad2(d.getDate()));}

const EXT={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',mp4:'video/mp4',webm:'video/webm',csv:'text/csv',md:'text/markdown',json:'application/json',txt:'text/plain'};
const OK_TYPES=new Set(Object.values(EXT));
function uploadMsg(e,name){const c=e&&e.code;return '“'+name+'”: '+({too_large:'arquivo grande demais (limite de 20 MB).',unsupported_type:'formato não aceito. Anexe como link.',quota_or_state:'o espaço de anexos está cheio. Remova anexos antigos.',rate_limited:'muitos envios seguidos. Tente de novo em instantes.',upstream_auth:'sua sessão expirou. Recarregue a página.',invalid_request:'o arquivo não pôde ser lido.'}[c]||'não foi possível enviar agora. Tente de novo.');}
async function uploadFiles(files){
  const id=ui.openId;if(!id||!files||!files.length)return;
  const ce=driveOn?CEd():null;
  if(!assetsNs&&!ce){toast('Envio de arquivos indisponível aqui. Use “Adicionar link”.');return;}
  for(const f of Array.from(files)){
    uploading++;renderDrawer();
    try{
      let att=null;
      if(ce){
        try{const t=tasks.get(id);const r=await ce.driveUpload(f,{task:t});att={id:'d'+r.id,kind:'drive',name:f.name,type:f.type,size:f.size,url:r.url,at:new Date().toISOString()};}
        catch(e){const msg=ce.driveErr(e,f.name);if(!assetsNs){toast(msg);continue;}toast(msg+' Salvo só no Painel.');}
      }
      if(!att){
        const ext=(f.name.split('.').pop()||'').toLowerCase();
        const type=OK_TYPES.has(f.type)?f.type:EXT[ext];
        if(!type){toast('“'+f.name+'”: formato não aceito. Use “Adicionar link”.');continue;}
        if(f.size>(type==='image/svg+xml'?2:20)*1048576){toast('“'+f.name+'” passa do limite de tamanho.');continue;}
        const r=await assetsNs.upload(f,{type});att={id:r.id,kind:'file',name:f.name,type:r.contentType,size:r.sizeBytes,at:new Date().toISOString()};
      }
      const cur=tasks.get(id);
      if(cur)updateTask(id,{attachments:(cur.attachments||[]).concat([att])},['Anexo adicionado: '+f.name+(att.kind==='drive'?' (Drive)':'')]);
    }catch(e){toast(uploadMsg(e,f.name));}
    finally{uploading--;renderDrawer();}}}
async function addLink(id){
  const url=await ask({title:'Adicionar link',text:'Cole o endereço do arquivo no Drive, OneDrive, SharePoint ou outro site.',placeholder:'https://…',ok:'Adicionar',max:2000});
  if(!url)return;if(!/^https?:\/\/\S+$/i.test(url)){toast('O link precisa começar com https://');return;}
  let name=url;try{const u=new URL(url);const tail=u.pathname.split('/').filter(Boolean).pop();name=u.hostname.replace(/^www\./,'')+(tail?' · '+decodeURIComponent(tail).slice(0,48):'');}catch(e){}
  const cur=tasks.get(id);if(!cur)return;
  updateTask(id,{attachments:(cur.attachments||[]).concat([{id:'l'+Date.now().toString(36),kind:'link',name,url,at:new Date().toISOString()}])},['Link anexado: '+name]);renderDrawer();}
async function delAtt(id,aid){

  const ok=await ask({title:'Remover “'+a.name+'”?',text:a.kind==='file'?'O arquivo será apagado de forma definitiva.':a.kind==='drive'?'O arquivo continua no Drive; só sai da demanda.':'O link sai da demanda.',ok:'Remover',danger:true,input:false});if(!ok)return;
  if(a.kind==='file'&&assetsNs){try{await assetsNs.delete(a.id);}catch(e){if(e&&e.code==='not_uploader'){toast('Só quem enviou este arquivo, ou quem edita a página, pode removê-lo.');return;}}}
  const cur=tasks.get(id);if(cur)updateTask(id,{attachments:(cur.attachments||[]).filter(x=>x.id!==aid)},['Anexo removido: '+a.name]);renderDrawer();}

/* ---------- modal ---------- */
function ask({title,text,value,placeholder,ok,danger,input,max}){
  return new Promise(res=>{
    const host=$('#modalHost');
    host.innerHTML='<div class="modal-scrim"><form class="modal" id="mform"><h3>'+esc(title)+'</h3>'+(text?'<p>'+esc(text)+'</p>':'')+(input!==false?'<input id="m-in" maxlength="'+(max||60)+'" value="'+esc(value||'')+'" placeholder="'+esc(placeholder||'')+'">':'')+'<div class="acts"><button type="button" class="btn" id="m-cancel">Cancelar</button><button type="submit" class="btn '+(danger?'danger armed':'primary')+'">'+esc(ok||'Salvar')+'</button></div></form></div>';
    const done=v=>{host.innerHTML='';res(v);};
    $('#mform').addEventListener('submit',e=>{e.preventDefault();if(input===false)return done(true);const v=$('#m-in').value.trim();if(!v)return $('#m-in').focus();done(v);});
    $('#m-cancel').addEventListener('click',()=>done(null));
    host.querySelector('.modal-scrim').addEventListener('click',e=>{if(e.target.classList.contains('modal-scrim'))done(null);});
    host.addEventListener('keydown',function k(e){if(e.key==='Escape'){host.removeEventListener('keydown',k);done(null);}});
    setTimeout(()=>{const i=$('#m-in');if(i){i.focus();i.select();}else host.querySelector('button[type=submit]').focus();},0);
  });}
let toastT;function toast(msg){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},2600);}

  return false;}
function setView(v,extra){Object.assign(ui,{view:v,node:null,sphere:null,colAdd:null,showAllDone:false},extra||{});ui.q='';$('#q').value='';$('#q').closest('.search').classList.remove('has-q');$('#app').classList.remove('nav-open');render();$('#content').scrollTop=0;}
function newCatId(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
async function addCat(sphere,parentId){
  const parent=parentId?catById(parentId):null;
  const name=await ask({title:parent?'Nova subcategoria em '+parent.name:'Nova categoria em '+SPH[sphere],placeholder:parent?'Ex.: Hotéis':'Ex.: Viagens',ok:'Criar'});
  if(!name)return;
  const n={id:newCatId(),name,sphere:parent?parent.sphere:sphere,parentId:parentId||null,order:children(parentId||null,sphere).length};
  cats=cats.concat([n]);if(parentId)delete ui.collapsed[parentId];persistCats();toast('Categoria “'+name+'” criada');}
async function renameCat(id){const n=catById(id);if(!n)return;const name=await ask({title:'Renomear categoria',value:n.name,ok:'Renomear'});if(!name||name===n.name)return;cats=cats.map(c=>c.id===id?Object.assign({},c,{name}):c);persistCats();}
async function delCat(id){
  const n=catById(id);if(!n)return;const set=descendants(id);const affected=[...tasks.values()].filter(t=>t.categoryId===id);
  const parent=n.parentId?catById(n.parentId):null;
  const ok=await ask({title:'Excluir “'+n.name+'”?',text:(affected.length?affected.length+' demanda(s) passam para '+(parent?'“'+parent.name+'”':SPH[n.sphere]+' (sem categoria)')+'. ':'')+(set.size>1?'As subcategorias sobem um nível. ':'')+'Nenhuma demanda é apagada.',ok:'Excluir categoria',danger:true,input:false});
  if(!ok)return;
  cats=cats.filter(c=>c.id!==id).map(c=>c.parentId===id?Object.assign({},c,{parentId:n.parentId||null}):c);
  persistCats();
  affected.forEach(t=>updateTask(t.id,parent?{categoryId:parent.id}:{categoryId:null,sphere:n.sphere}));
  if(ui.view==='node'&&ui.node===id)setView(parent?'node':'sphere',parent?{node:parent.id}:{sphere:n.sphere});}
function applyClass(id,val){if(!val)return updateTask(id,{categoryId:null,sphere:null});else if(val.startsWith('s:'))updateTask(id,{categoryId:null,sphere:val.slice(2)});else{const n=catById(val.slice(2));if(n)updateTask(id,{categoryId:n.id,sphere:n.sphere});}}

  if(t.closest('.drawer')){const id=ui.openId;if(!id)return;

    else if(t.id==='d-pri')updateTask(id,{priority:t.value||null});

    else if(t.id==='d-needs')updateTask(id,{needsExec:t.checked});
    else if(t.id==='d-exec')updateTask(id,{executive:t.value||null});
    else if(t.id==='d-due')updateTask(id,{due:t.value||null});
    else if(t.id==='f-waiting')updateTask(id,{waitingFor:t.value.trim()});
    else if(t.id==='d-notes')updateTask(id,{notes:t.value});
    else if(t.dataset.dfield)updateTask(id,{fields:{[t.dataset.dfield]:t.value}});
    else if(t.dataset.ck){const cur=tasks.get(id);const v=t.value.trim();const old=(cur.checklist||[]).find(c=>c.id===t.dataset.ck);if(!old)return;if(!v){t.value=old.text;return;}if(v!==old.text)updateTask(id,{checklist:cur.checklist.map(c=>c.id===old.id?Object.assign({},c,{text:v}):c)},['Item do checklist renomeado: '+v]);return;}
    else if(t.id==='ck-new')return;
    if(t.id!=='f-waiting'&&t.id!=='d-notes'&&t.id!=='d-title'&&document.activeElement.id!=='f-waiting')renderDrawer();

});
document.addEventListener('input',e=>{if(e.target.id==='d-title'){e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}});
document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('.drawer')){setTimeout(()=>{if(!$('#drawerHost').contains(document.activeElement))renderDrawer();},0);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='d-title'){e.preventDefault();e.target.blur();}});

/* ---------- dica do gráfico ---------- */
let tipEl=null;
document.addEventListener('mousemove',e=>{const seg=e.target.closest&&e.target.closest('[data-tip]');if(!seg){if(tipEl)tipEl.hidden=true;return;}if(!tipEl){tipEl=document.createElement('div');tipEl.className='ov-tip';document.body.appendChild(tipEl);}tipEl.textContent=seg.dataset.tip;tipEl.hidden=false;const x=Math.min(e.clientX+12,innerWidth-tipEl.offsetWidth-8),y=e.clientY-tipEl.offsetHeight-10;tipEl.style.left=x+'px';tipEl.style.top=(y<8?e.clientY+16:y)+'px';});
/* ---------- arrastar arquivos para a gaveta ---------- */
const hasFiles=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files');
document.addEventListener('dragover',e=>{if(dragId||!hasFiles(e))return;const z=e.target.closest&&e.target.closest('.drawer');if(z&&(assetsNs||driveOn)){e.preventDefault();const d=$('#dropzone');if(d)d.classList.add('over');}});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget||!(e.relatedTarget.closest&&e.relatedTarget.closest('.drawer'))){const d=$('#dropzone');if(d)d.classList.remove('over');}});
document.addEventListener('drop',e=>{if(dragId||!hasFiles(e))return;const z=e.target.closest&&e.target.closest('.drawer');if(!z)return;e.preventDefault();const d=$('#dropzone');if(d)d.classList.remove('over');uploadFiles(e.dataTransfer.files);});
/* ---------- arrastar ---------- */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-id][draggable]');if(!c)return;dragId=c.dataset.id;c.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';}catch(x){}});
document.addEventListener('dragend',e=>{dragId=null;document.querySelectorAll('.dragging,.drag-over,.drop-hover').forEach(x=>x.classList.remove('dragging','drag-over','drop-hover'));});
document.addEventListener('dragover',e=>{if(!dragId)return;const col=e.target.closest('[data-col]');const dz=e.target.closest('[data-drop]');if(col||dz){e.preventDefault();document.querySelectorAll('.drag-over,.drop-hover').forEach(x=>x.classList.remove('drag-over','drop-hover'));if(col)col.classList.add('drag-over');if(dz)dz.classList.add('drop-hover');}});
document.addEventListener('drop',e=>{if(!dragId)return;const col=e.target.closest('[data-col]');const dz=e.target.closest('[data-drop]');const id=dragId;
  if(col){e.preventDefault();updateTask(id,{status:col.dataset.col});}
  else if(dz){e.preventDefault();const v=dz.dataset.drop;const t=tasks.get(id);applyClass(id,v==='none'?'':v);toast('D-'+pad4(t.num)+' classificada em '+classLabel(tasks.get(id)));}
  dragId=null;document.querySelectorAll('.dragging,.drag-over,.drop-hover').forEach(x=>x.classList.remove('dragging','drag-over','drop-hover'));});

setInterval(()=>{if(!document.hidden&&!$('#drawerHost').contains(document.activeElement))render();},60000);
setInterval(()=>{const t=ui.openId&&tasks.get(ui.openId);if(t&&t.status==='andamento'){const c=$('#clock'),w=$('#worked');if(c)c.textContent=fmtClock(workedMs(t));if(w)w.textContent=fmtDur(workedMs(t));}},1000);
window.CS={ready:id=>!!(loaded.tasks&&tasks.has(id)),openTask:id=>{setView('inbox');openDrawer(id);}};
render();boot();
})();
</script>

</body></html>
