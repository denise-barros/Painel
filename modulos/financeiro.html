<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

/* busca discreta: ícone que abre ao clicar */
.top .toolbar .search{flex:0 0 auto;min-width:0;width:34px;transition:width .18s}
.top .toolbar .search:focus-within,.top .toolbar .search:has(input:not(:placeholder-shown)){width:220px}
.top .toolbar .search input{cursor:pointer;padding-right:0;padding-left:32px}.top .toolbar .search:focus-within input,.top .toolbar .search:has(input:not(:placeholder-shown)) input{padding-right:12px}.top .toolbar .search svg{pointer-events:none}
.top .toolbar .search:not(:focus-within) input:placeholder-shown::placeholder{color:transparent}
.top .toolbar .search:not(:focus-within):not(:has(input:not(:placeholder-shown))) svg{left:10px}

/* todas as listas de lançamentos e nas demandas */

.tbl .row .tt{font-family:"Plus Jakarta Sans",sans-serif;font-size:11px;font-weight:600;letter-spacing:-.01em}.fdem-row b{font-size:11px;font-weight:500}
/* itens do Cronograma (lista e calendário) */
.tb-cronograma .row,.tb-cronograma .row .tag,.tb-cronograma .row .pill,.tb-cronograma .row .v,.cal .ev{font-family:"Plus Jakarta Sans",var(--font-body,sans-serif)}
.tb-cronograma .row .tt{font-family:"Plus Jakarta Sans",sans-serif;font-size:11px;font-weight:600;letter-spacing:-.01em}
/* indicadores no mesmo formato dos outros módulos: rótulo em cima, número embaixo */
.tiles{gap:10px}
.tile{display:flex;flex-direction:column-reverse;justify-content:flex-end;border-radius:14px;padding:11px 14px}
.tile span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.tile b{font-family:inherit;font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:2px}

/* tipografia Plus Jakarta Sans: títulos mais firmes, números alinhados */
.kpi b,.tile b,.v,.num{font-variant-numeric:tabular-nums}
</style></head><body>
<title>Financeiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: menu fixo à esquerda (marca, novo lançamento, grupos, status de gravação) | área de trabalho: cabeçalho com busca e registro rápido, barra de ferramentas, listas agrupadas | gaveta de edição à direita */
:root{
  --bg:#E1E9DF; --surface:#FFFFFF; --sunk:#F1F5EF; --line:#D3E0D8; --line-strong:#C3D3C9;
  --ink:#1F2A25; --muted:#526159; --faint:#7E8C84;
  --accent:#3F7A62; --accent-soft:#DCEBE3; --accent-ink:#3F7A62; --on-accent:#FFFFFF;
  --pos:#3F7A5F; --pos-soft:#DCEBE3; --neg:#C2366B; --neg-soft:#FBE1EA; --warn:#B0305E; --warn-soft:#FCE8EF; --pro:#B0305E; --pro-soft:#FBE1EA;
  --shadow:0 1px 2px rgba(31,42,37,.06),0 2px 8px rgba(31,42,37,.05); --shadow-lg:0 12px 40px rgba(31,42,37,.18);
  --font-display:"Sora","Plus Jakarta Sans",system-ui,sans-serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --pill:999px;
  --surface-2:#F1F5EF;
  --slate-2:#F1F5EF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141a; --surface:#1a1e26; --sunk:#20252f; --line:#272d38; --line-strong:#2f3644;
  --ink:#e6e9ef; --muted:#a0a8b6; --faint:#737c8c;
  --accent:#86BFA6; --accent-soft:#1F3A30; --accent-ink:#86BFA6; --on-accent:#0E1F18;
  --pos:#79d287; --pos-soft:#1d3721; --neg:#E8928A; --neg-soft:#45221E; --warn:#f1b858; --warn-soft:#3d2f15; --pro:#d791db; --pro-soft:#3a2440;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#1a1e26; --sunk:#20252f; --line:#272d38; --line-strong:#2f3644;
  --ink:#e6e9ef; --muted:#a0a8b6; --faint:#737c8c;
  --accent:#86BFA6; --accent-soft:#1F3A30; --accent-ink:#86BFA6; --on-accent:#0E1F18;
  --pos:#79d287; --pos-soft:#1d3721; --neg:#E8928A; --neg-soft:#45221E; --warn:#f1b858; --warn-soft:#3d2f15; --pro:#d791db; --pro-soft:#3a2440;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:11px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.v,.tile b,.d{font-variant-numeric:tabular-nums lining-nums}
.sr{position:absolute;left:-9999px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
/* menu */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{padding:16px 16px 12px;display:flex;align-items:center;gap:9px}
.brand-mark{width:28px;height:28px;border-radius:9px;background:#6B7A72;color:#FFFFFF;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:9.5px;letter-spacing:-.02em;flex:none}
.brand h1{font-family:var(--font-display);font-weight:600;font-size:11.5px;letter-spacing:-.03em;margin:0;line-height:1.1}
.brand small{display:block;font-size:9.5px;color:var(--muted);margin-top:2px}
.btn-new{margin:2px 14px 10px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--pill);padding:9px 12px;font-weight:700;letter-spacing:-.01em}
.btn-new:hover{filter:brightness(1.05)}
.btn-new[hidden]{display:none}
.side-scroll{overflow:auto;flex:1;padding:2px 10px 20px}
.ng{margin-top:6px}
.gh{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;padding:5px 10px 5px 6px;border-radius:var(--pill);color:var(--ink)}
.gh:hover{background:var(--sunk)}
.gh.on{background:var(--accent-soft)}
.gh.on b{color:var(--accent)}
.gh b{font-weight:700;font-size:10.5px;letter-spacing:-.005em;line-height:1.25}
.chip{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--tint);color:var(--tint-ink)}
.chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.t-indigo{--tint:#e4e7fb;--tint-ink:#3a46b0}.t-green{--tint:#ddf3e6;--tint-ink:#1d7346}.t-blue{--tint:#dfebfb;--tint-ink:#2160b5}.t-violet{--tint:#eee5fb;--tint-ink:#6e3db8}.t-amber{--tint:#fbefcf;--tint-ink:#8a5b00}.t-rose{--tint:#fbe3ec;--tint-ink:#a12e5c}.t-slate{--tint:#e6e9ef;--tint-ink:#3b4456}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip{--tint:var(--sunk);filter:brightness(1.4)}}
:root[data-theme="dark"] .chip{--tint:var(--sunk);filter:brightness(1.4)}
.nv{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:5px 10px 5px 39px;border-radius:var(--pill);color:var(--ink)}
.nv:hover{background:var(--sunk)}
.nv.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nv .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nv.on .cnt{color:var(--accent)}
.sg{padding:7px 10px 2px 39px;font-size:9.5px;font-weight:700;letter-spacing:.02em;color:var(--muted)}
.nv.n2{padding-left:51px}
.side-foot{border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));font-size:9.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync-dot.ok{background:var(--pos)}.sync-dot.busy{background:var(--warn)}.sync-dot.local{background:var(--neg)}
.side-scrim{display:none}

/* área principal */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{padding-block:12px 6px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.menu-btn{display:none;width:34px;height:34px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--pill);place-items:center;flex:none}
.title-wrap{flex:0 1 auto;min-width:0;max-width:40%}
.back-home{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:0;border-radius:999px;padding:2px 9px;margin-right:6px;cursor:pointer}
.crumb{font-size:9.5px;color:var(--muted);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-title{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:-.035em;margin:0;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-sub{color:var(--muted);font-size:9.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:0 1 230px;min-width:150px;margin-left:auto}
.search input{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--pill);padding:7px 12px 7px 32px}
.search input:focus{border-color:var(--ink);outline:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.capture{flex:1 1 300px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:3px 3px 3px 14px;box-shadow:var(--shadow)}
.capture:focus-within{border-color:var(--ink)}
.capture input{flex:1;min-width:0;border:0;background:none;padding:5px 0;outline:none}
.capture .ctx{font-size:9.5px;color:var(--muted);white-space:nowrap;max-width:38%;overflow:hidden;text-overflow:ellipsis}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drawer.ro .dr-body :is(input,select,textarea):disabled{background:transparent;border-color:transparent;color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink);appearance:none;-webkit-appearance:none;padding-left:0;resize:none;background-image:none}
.drawer.ro .dr-body button:disabled{opacity:1}
.drawer.ro .dr-foot .btn:not(.ro-keep){display:none}
.drawer .edit-btn{margin-right:6px;white-space:nowrap}
.toolbar .grow{flex:1}
.toolbar.filters{margin-top:8px}.toolbar.filters .lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.more{position:relative}.more>summary{list-style:none;cursor:pointer}.more>summary::-webkit-details-marker{display:none}
.more-m{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface,#fff);border:1px solid var(--line-strong,#d5d9e2);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:190px;box-shadow:0 8px 24px rgba(20,30,60,.14)}
.more-m .btn,.more-m a.btn{justify-content:flex-start;border:0;background:transparent;text-align:left;white-space:nowrap}
.more-m .btn:hover{background:rgba(0,0,0,.05)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--pill);padding:6px 13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:10.5px;text-decoration:none;color:var(--ink)}
.btn,.seg button{justify-content:center;text-align:center}.seg button{display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.05);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:10px}
.btn.ico{width:30px;height:30px;padding:0;line-height:0;gap:0;justify-content:center;display:inline-flex;align-items:center;list-style:none}.btn.ico::-webkit-details-marker{display:none}
.btn.danger{color:var(--neg)}
.btn.danger.armed{background:var(--neg);border-color:var(--neg);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--pill);background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:4px 12px;font-size:10px;color:var(--muted);border-radius:var(--pill);font-weight:600}
.seg button.on{background:#6B7A72;color:#FFFFFF}
.sel{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--pill);padding:5px 10px;font-size:10px;height:30px}
.content{flex:1;overflow:auto;min-height:0;padding-block:6px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.banner{background:var(--warn-soft);color:var(--warn);font-size:10px;padding:9px 14px;border-radius:12px;margin-bottom:12px}
.sumline{display:flex;flex-wrap:wrap;gap:4px 18px;margin:2px 0 14px;font-size:10px;color:var(--muted)}
.tb-assinaturas .sumline,.tb-pontos .sumline{margin:0 0 8px}
.sumline b{color:var(--ink);font-weight:700} .sumline b.pos{color:var(--pos)} .sumline b.neg{color:var(--neg)}

/* grupos e linhas */
.tbl{margin-bottom:26px}
.tbl-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.tbl-h h3{margin:0 auto 0 0;font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:-.025em}
.group{margin-bottom:20px}
.group-h{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:12px;letter-spacing:-.02em;font-weight:600;margin:0 0 8px}
.group-h .cnt{font-family:var(--font-body);background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:0 8px;color:var(--ink);letter-spacing:0}
.group-h .tot{margin-left:auto;font-family:var(--font-body);font-size:10.5px;color:var(--muted);letter-spacing:0;font-weight:600}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:22px 52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row.hl{background:var(--warn-soft)}
.row.done .tt{color:var(--muted)}
.row .d{font-size:10px;color:var(--muted);font-weight:600}
.row .t{min-width:0;display:flex;flex-direction:column;gap:4px}
.row .tt{font-weight:600;overflow-wrap:anywhere}
.row-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.row .v{font-weight:700;font-size:11px;white-space:nowrap}
.row .v.neg{color:var(--neg)}
.check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);background:none;display:grid;place-items:center;padding:0;color:var(--surface)}
.check:hover{border-color:var(--pos)}
.check.on{background:var(--pos);border-color:var(--pos)}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:var(--pill);background:var(--sunk);color:var(--muted);border:1px solid var(--line);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.ok,.pill.ok{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.tag.warn,.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.bad,.pill.bad{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.tag.info,.pill.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill{display:inline-flex;font-size:9.5px;font-weight:600;padding:2px 9px;border-radius:var(--pill);background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.qsel{height:24px;border-radius:var(--pill);border:1px solid var(--line-strong);background:var(--sunk);color:var(--muted);font-size:9.5px;font-weight:700;padding:0 8px}
.qsel.ok{background:var(--pos-soft);color:var(--pos);border-color:transparent}.qsel.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.qsel.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}.qsel.bad{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.empty-big{text-align:center;color:var(--muted);padding:48px 16px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:16px}
.empty-big b{display:block;font-family:var(--font-display);font-size:15px;letter-spacing:-.035em;color:var(--ink);margin-bottom:6px;font-weight:600}
.foot{display:flex;justify-content:space-between;gap:8px;font-size:9.5px;color:var(--faint);margin-top:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.panel h3{margin:0 0 12px;font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:-.025em}
.panel p{margin:0 0 10px;color:var(--muted);font-size:10px;max-width:72ch}
.panel textarea{width:100%;min-height:120px;border:1px solid var(--line-strong);border-radius:12px;padding:8px 10px;font-size:10.5px;background:var(--sunk);font-family:ui-monospace,Menlo,monospace}
.panel .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.mb{margin-bottom:14px}

/* gaveta */
#fin-drawer .scrim{position:fixed;inset:0;background:rgba(15,20,30,.32);z-index:40}
.drawer{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));max-height:min(80vh,720px);background:var(--surface);box-shadow:var(--shadow-lg);z-index:41;display:flex;flex-direction:column;border-radius:18px;overflow:hidden}
.drawer .dr-body{min-height:0}
.dr-head{display:flex;align-items:center;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.stamp{font-size:9.5px;color:var(--muted);border:1px solid var(--line-strong);border-radius:var(--pill);padding:1px 9px;letter-spacing:.02em}
.icon-btn{border:0;background:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;margin-left:auto}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.dr-body{overflow:auto;flex:1;padding:16px 20px 24px;display:flex;flex-direction:column;gap:16px}
.dr-title{font-family:var(--font-display);font-size:17.5px;font-weight:600;line-height:1.2;letter-spacing:-.035em;margin:0}
.fields{display:grid;grid-template-columns:128px minmax(0,1fr);gap:9px 12px;align-items:center}
.fields label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.fields input,.fields select,.fields textarea{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:10.5px}
.fields input:focus,.fields select:focus,.fields textarea:focus{border-color:var(--ink);outline:none}
.fields textarea{min-height:76px;resize:vertical}

<script>
/* Kanban do Secretariado: as demandas ficam na mesma base de dados do Painel */
(function(){
"use strict";
let db=null;const tasks=new Map();
const ST={nova:"A fazer",andamento:"Em andamento",aguardando:"Aguardando",concluido:"Concluído"};
const EX={fernando:"Fernando Shayer",leticia:"Leticia Lyle",ambos:"Fernando e Leticia"};
const fd=s=>{if(!s)return"sem prazo";const[y,m,d]=s.split("-");return d+"/"+m+"/"+y};
const save=t=>{tasks.set(t.id,t);if(db)db.doc("tasks/"+t.id).set(t).catch(()=>{try{window.FIN&&FIN.toast&&FIN.toast("Não foi possível salvar na Operação.")}catch(e){}})};
const refresh=()=>{try{window.FIN&&window.FIN.refresh()}catch(e){}};
(async()=>{try{if(window.claude&&claude.use)db=await claude.use("db")}catch(e){db=null}
  if(db)db.collection("tasks").onSnapshot(s=>{tasks.clear();s.docs.forEach(d=>{const v=d.data();if(v)tasks.set(d.id,Object.assign({},v,{id:d.id}))});refresh()},()=>{})})();
function nextNum(){let m=0;tasks.forEach(t=>{if((t.num||0)>m)m=t.num});return m+1}
window.CS={
  getTask:id=>tasks.get(id)||null,
  allTasks:()=>[...tasks.values()],
  newTask(title,preset){
    if(!db)return null;
    const now=new Date().toISOString();const id="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const t=Object.assign({id,num:nextNum(),title:String(title).trim(),status:"nova",sphere:null,categoryId:null,priority:null,executive:null,assignees:[],delegatedAt:null,due:null,waitingFor:"",notes:"",fields:{},attachments:[],checklist:[],sessions:[],timerStart:null,createdAt:now,updatedAt:now,completedAt:null,waitingSince:null},preset||{});
    t.statusLog=[{s:t.status,at:now}];
    t.history=[{at:now,text:"Demanda registrada pelo financeiro"+(t.sphere?" em "+(t.sphere==="pessoal"?"Pessoal":"Corporativo"):"")}];
    save(t);return t},
  updateTask(id,patch,extra){
    const old=tasks.get(id);if(!old)return;const t=JSON.parse(JSON.stringify(old));const now=new Date().toISOString();const notes=[];
    for(const k of Object.keys(patch)){const v=patch[k];if(JSON.stringify(t[k]??null)===JSON.stringify(v??null))continue;
      if(k==="title")notes.push("Título alterado");
      else if(k==="status")notes.push("Status: "+(ST[t.status]||"—")+" → "+(ST[v]||"—"));
      else if(k==="due")notes.push("Prazo: "+fd(t.due)+" → "+fd(v));
      else if(k==="executive")notes.push("Executivo: "+(EX[t.executive]||"nenhum")+" → "+(EX[v]||"nenhum"));
      t[k]=v}
    if(extra)notes.push(...extra);if(!notes.length)return;
    if("status" in patch&&patch.status!==old.status){
      t.completedAt=patch.status==="concluido"?now:null;t.waitingSince=patch.status==="aguardando"?now:null;
      const log=(old.statusLog&&old.statusLog.length)?old.statusLog:[{s:"nova",at:old.createdAt}];t.statusLog=log.concat([{s:patch.status,at:now}]).slice(-200);
      if(patch.status==="concluido"&&t.timerStart){t.sessions=(t.sessions||[]).concat([{start:t.timerStart,end:now}]);t.timerStart=null;notes.push("Cronômetro pausado ao concluir")}}
    t.updatedAt=now;t.history=(t.history||[]).concat(notes.map(text=>({at:now,text}))).slice(-150);save(t)},
  removeTask(id){tasks.delete(id);if(db)db.doc("tasks/"+id).delete().catch(()=>{})},
  openTask(id){try{window.parent.CE.openTask(id)}catch(e){}}
};
})();
</script>

  if(typeof s==="number")return s; if(s==null)return null;

  let neg=/^\(.*\)$/.test(s)||s.startsWith("-"); s=s.replace(/[()\-]/g,"");

  if(!s)return""; s=String(s).trim(); let m;

async function uploadAtt(files){
  const ce=driveOn?CEd():null;
  if(!assetsNs&&!ce){toast("Envio de arquivos indisponível aqui. Use “Adicionar link”.");return}
  for(const f of Array.from(files||[])){
    fAtt.up++;renderAtt();
    try{
      let att=null;
      if(ce){try{const r=await ce.driveUpload(f,{fin:true});att={id:"d"+r.id,kind:"drive",name:f.name,type:f.type,size:f.size,url:r.url,at:new Date().toISOString()}}
        catch(e){const msg=ce.driveErr(e,f.name);if(!assetsNs){toast(msg);continue}toast(msg+" Salvo só no Painel.")}}

    finally{fAtt.up--;renderAtt()}}
}

const DIAS3=["dom","seg","ter","qua","qui","sex","sáb"];
function calendarHTML(){

    const tbc=TABS.flatMap(t=>t.tables||[]).find(x=>x.id==="cronograma");const crRows=tbc?visibleRows(tbc,Object.assign(ctxFor(),{month:m}),true):(data.cronograma||[]);const pf=(state.filters.cronograma||{})._pend;
    crRows.filter(r=>!pf||(pendAnt(r,state.month).length>0)===(pf==="1")).forEach(r=>{const dd=parseInt(r.venc);if(!dd)return;const d=Math.min(dd,last);const s=((r.meses||{})[m]||{}).s;if(s==="Não se aplica")return;
      let tn=s==="Pago"||s==="Emitido"?"ok":s==="Pendente"||s==="Verificar"?"warn":"";if(!s&&new Date(y,mo-1,d)<t0)tn="bad";
      push(d,{o:"cronograma|"+r.id,l:r.despesa||"Despesa",tn,t:`${r.despesa||""}${r.quem?" · "+r.quem:""}${s?" · "+s:""}`})});

    return cache[m]={ev,last}};

  if(mode==="dia"){const[yy,mm]=state.month.split("-").map(Number);const lastD=new Date(yy,mm,0).getDate();return h+`<div class="cal" style="grid-template-columns:1fr">${cell(new Date(yy,mm-1,Math.min(+f._dia,lastD)),true)}</div>`}
  if(mode==="hoje")return h+`<div class="cal" style="grid-template-columns:1fr">${cell(t0,true)}</div>`;
  if(mode==="atual"){const mon=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()-((t0.getDay()+6)%7));h+=`<div class="cal">`;["seg","ter","qua","qui","sex","sáb","dom"].forEach(d=>h+=`<div class="dh">${d}</div>`);
    for(let k=0;k<7;k++)h+=cell(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+k),false);return h+`</div>`}
  const m=state.month;const[y,mo]=m.split("-").map(Number);const last=new Date(y,mo,0).getDate();const start=(new Date(y,mo-1,1).getDay()+6)%7;
  h+=`<div class="cal">`;["seg","ter","qua","qui","sex","sáb","dom"].forEach(d=>h+=`<div class="dh">${d}</div>`);
  for(let k=0;k<start;k++)h+=`<div class="dc off"></div>`;
  for(let d=1;d<=last;d++)h+=cell(new Date(y,mo-1,d),false);
  return h+`</div>`;
}

  if(tab.monthly){const f=state.filters.cronograma||{},hj=new Date().getDate(),at=!!f._sem,ho=!at&&+f._dia===hj,mes=state.cronGroup==="mes"&&!at&&!ho,sem=state.cronGroup!=="mes"&&!at&&!ho;h+=`<div class="seg" role="group" aria-label="Período da lista"><button data-cgroup="hoje" class="${ho?"on":""}">Hoje</button><button data-cgroup="atual" class="${at?"on":""}">Esta semana</button><button data-cgroup="semana" class="${!at&&!ho?"on":""}">Mês inteiro</button></div>`}
  if(tab.monthly)h+=`<div class="seg" role="group" aria-label="Visualização"><button data-view="list" class="${state.cronView!=="cal"?"on":""}">Lista</button><button data-view="cal" class="${state.cronView==="cal"?"on":""}">Calendário</button></div>`;
  if(tab.matrix||tab.reports){const ys=[...new Set([new Date().getFullYear()-1,new Date().getFullYear(),new Date().getFullYear()+1,state.year])].sort();h+=`<label class="sr" for="fyr">Ano</label><select class="sel" id="fyr" data-year>${ys.map(a=>`<option ${a===state.year?"selected":""}>${a}</option>`).join("")}</select>`}
  const inl=isList&&!multi;if(inl){const fl=state.filters[first.id]||{};const act=Object.keys(fl).some(k=>fl[k]&&k!=="_sem"&&k!=="_pend"&&!(first.id==="assinaturas"&&k==="_mes"));h+=filtersHTML(first)+(act?`<button class="btn sm" data-fclear="${first.id}">Limpar filtros</button>`:"")+pendBtns(first,fl)}
  h+=`<span class="grow"></span>`+srch;
  const more=[];
  if(isList&&!multi&&!tab.parcelas)more.push(tableTools(first));
  if(tab.matrix)more.push(`<button class="btn sm" data-csv="${tab.id}">Exportar CSV</button>`);
  if(tab.src&&tab.src.length)more.push(`<a class="btn sm" href="${tab.src[0][1]}" target="_blank" rel="noopener" title="${esc(tab.src.map(x=>x[0]).join(" · "))}">Planilha no Drive ↗</a>`);
  if(isList&&!multi&&!tab.parcelas)h+=`<button class="btn sm primary ico" data-add="${first.id}" title="Novo lançamento" aria-label="Novo lançamento"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>`;
  if(more.length)h+=`<details class="more"><summary class="btn sm ico" title="Mais opções" aria-label="Mais opções"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></summary><div class="more-m">${more.join("")}</div></details>`;
  h+=`</div>`;
  if(isList&&!multi&&!inl){const fh=filtersHTML(first);const fl=state.filters[first.id]||{};const act=Object.keys(fl).some(k=>fl[k]&&k!=="_sem"&&k!=="_pend");if(fh)h+=`<div class="toolbar filters"><span class="lbl">Filtrar</span>${fh}${act?`<button class="btn sm" data-fclear="${first.id}">Limpar filtros</button>`:""}${pendBtns(first,fl)}</div>`}
  return h;
}
function pendBtns(tb,fl){if(tb.id!=="cronograma")return"";const m=state.month;const n=(data.cronograma||[]).filter(r=>pendAnt(r,m).length).length;
  return `<span class="grow"></span><button class="btn sm ${fl._pend==="1"?"primary":""}" data-pend="1" title="Despesas com meses anteriores (últimos 6) ainda Pendente ou Verificar">Com pendência anterior${n?` (${n})`:""}</button><button class="btn sm ${fl._pend==="0"?"primary":""}" data-pend="0">Tudo em dia</button>`}
function render(){
  if(!state.tab)return;

  const ae=document.activeElement;const aid=ae&&ae.id;const sel=ae&&ae.selectionStart;const capVal=($("#fcap")||{}).value||"";

  if(tab.parcelas&&state.advance){const rows=data.parcelas||[];const fim=rows.filter(r=>r.total&&(+r.atual||0)>=+r.total).length;const av=rows.length-fim;
    h+=`<div class="panel mb"><h3>Avançar de ${fmtMonth(cfg.parcelasRef)} para ${fmtMonth(addMonths(cfg.parcelasRef,1))}?</h3><p>${fim} parcela${fim===1?"":"s"} encerrada${fim===1?"":"s"} nesta fatura ser${fim===1?"á removida":"ão removidas"} e ${av} avança${av===1?"":"m"} uma parcela. Depois, confira as novas compras parceladas na fatura nova.</p><div class="acts"><button class="btn" data-advno>Cancelar</button><button class="btn primary" data-advyes>Avançar</button></div></div>`}
  if(tab.home)h+=homeHTML();
  else if(tab.reports)h+=reportsHTML();
  else if(tab.matrix)h+=matrixHTML(tab);
  else{if(tab.overview)h+=repassesOverview();
    if(tab.monthly&&state.cronView==="cal")h+=calendarHTML();
    else tab.tables.forEach(tb=>h+=listHTML(tb,ctx,tab.tables.length>1))}
  $("#fin-content").innerHTML=h;renderNav();
  if(aid&&!aid.startsWith("fi-")){const el=document.getElementById(aid);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(e){}}}
}

/* ---------- CSV ---------- */
function csvFor(tid){
  const tab=TABS.find(t=>t.id===tid);
  const q=v=>{v=v==null?"":String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  if(tab&&tab.matrix){const y=state.year;const rows=(data[tid]||[]).filter(r=>+r.ano===y);const lines=[["Grupo","Categoria",...MESL,"Total"]];
    tab.matrix.groups.forEach(g=>rows.filter(r=>r.grupo===g.k).forEach(r=>{let t=0;const vs=[];for(let i=1;i<=12;i++){const v=(r.m||{})[i];t+=+v||0;vs.push(hasV(v)?fmtMoney(v):"")}lines.push([g.l,r.cat,...vs,fmtMoney(t)])}));
    return{name:`Fluxo de caixa ${tab.l} ${y}.csv`,csv:lines.map(l=>l.map(q).join(";")).join("\r\n")}}
  const tb=tbById(tid);const ctx=ctxFor();const rows=visibleRows(tb,ctx);
  const lines=[tb.cols.map(c=>c.month?c.l+" "+fmtMonth(ctx.month):c.l),...rows.map(r=>tb.cols.map(c=>{const v=getVal(r,c,ctx);const t=c.t==="calc"?(c.ct||"text"):c.t;
    if(t==="money")return hasV(v)?fmtMoney(v):"";if(t==="num")return hasV(v)?fmtNum(v):"";if(t==="date")return fmtDate(v);if(t==="month")return fmtMonth(v);return v==null?"":v}))];
  return{name:`${tb.title}${gExec?" - "+(gExec==="fernando"?"Fernando":gExec==="leticia"?"Leticia":gExec):""} (${new Date().toLocaleDateString("pt-BR").replace(/\//g,".")}).csv`,csv:lines.map(l=>l.map(q).join(";")).join("\r\n")};
}
async function exportCsv(tid){const{name,csv}=csvFor(tid);
  if(!downloads){toast("A exportação não está disponível nesta visualização.");return}
  try{await downloads.save({filename:name,data:"﻿"+csv});toast("Arquivo exportado")}catch(e){if(e&&e.code==="declined")return;toast("Não foi possível exportar agora.")}}

/* ---------- colar do Sheets ---------- */
async function importPaste(tid){
  const ta=document.getElementById("pa-"+tid);if(!ta)return;const skip=document.getElementById("pa-skip-"+tid).checked;const pk=(document.getElementById("pa-k-"+tid)||{}).checked;
  const tb=tbById(tid);const ed=tb.cols.filter(c=>c.t!=="calc");
  let lines=ta.value.replace(/\r/g,"").split("\n").filter(l=>l.trim());if(skip)lines=lines.slice(1);
  if(!lines.length){toast("Cole ao menos uma linha antes de importar.");return}
  let n=0;
  for(const l of lines){const parts=l.split("\t");const o={};
    ed.forEach((c,i)=>{const raw=parts[i];if(raw==null||raw.trim()==="")return;const v=coerce(c,raw);if(v===null||v==="")return;
      if(c.month){o.meses=o.meses||{};o.meses[state.month]=o.meses[state.month]||{};o.meses[state.month][c.month]=v}else o[c.k]=v});
    if(tid==="parcelas"){const m=/(\d+)\s*\/\s*(\d+)/.exec(parts[ed.findIndex(c=>c.k==="atual")]||"");if(m){o.atual=+m[1];o.total=o.total||+m[2]}}
    if(Object.keys(o).length){o.criado=Date.now();try{const nid=await addRow(tid,o);if(pk)await kSend(tid,nid,Object.assign({id:nid},o));n++}catch(e){console.warn(e);toast("Parte das linhas não foi importada.");break}}}
  state.paste=null;render();toast(`${n} lançamento${n===1?"":"s"} importado${n===1?"":"s"}`);
}

/* ---------- eventos ---------- */
document.addEventListener("click",async e=>{

  const me=e.target.closest("[data-medit]");if(me&&!e.target.closest("input")){startMatrixEdit(me);return}
  const b=e.target.closest("[data-attfile],[data-attlink],[data-attlinkno],[data-attlinkgo],[data-attdel],[data-attdelno],[data-attdelyes],[data-kopen],[data-check],[data-view],[data-cgroup],[data-open],[data-fclose],[data-fsave],[data-fdel],[data-tab],[data-add],[data-new],[data-del],[data-delyes],[data-delno],[data-csv],[data-pend],[data-fclear],[data-paste],[data-pastego],[data-pastecancel],[data-addcat],[data-advance],[data-advyes],[data-advno],[data-navopen],[data-navclose]");

  if(d.navclose!==undefined){$("#app").classList.remove("nav-open");return}
  if(d.check){const[t,id]=d.check.split("|");const r=(data[t]||[]).find(x=>x.id===id);if(!r)return;const L=LIST[t],c=ctxFor();const dn=L.done(r,c);
    try{await updStamp(t,id,JSON.parse(JSON.stringify(dn?L.undoP(r,c):L.doP(r,c))));toast(dn?"Desmarcado":"Marcado como pago")}catch(err){toast("Não foi possível atualizar.")}return}
  if(d.attfile!==undefined){const i=document.getElementById("fi-file");if(i)i.click();return}
  if(d.attlink!==undefined){fAtt.link=true;renderAtt();const i=document.getElementById("fi-linkurl");if(i)i.focus();return}
  if(d.attlinkno!==undefined){fAtt.link=false;return renderAtt()}
  if(d.attlinkgo!==undefined){const i=document.getElementById("fi-linkurl");const url=(i&&i.value||"").trim();if(!/^https?:\/\/\S+$/i.test(url)){toast("O link precisa começar com https://");return}
    let name=url;try{const u=new URL(url);const tail=u.pathname.split("/").filter(Boolean).pop();name=u.hostname.replace(/^www\./,"")+(tail?" · "+decodeURIComponent(tail).slice(0,48):"")}catch(x){}
    fAtt.link=false;return saveAtt(fAtt.list.concat([{id:"l"+Date.now().toString(36),kind:"link",name,url,at:new Date().toISOString()}]),"Link anexado")}
  if(d.attdel){fAtt.del=d.attdel;return renderAtt()}
  if(d.attdelno!==undefined){fAtt.del=null;return renderAtt()}
  if(d.attdelyes){const a=fAtt.list.find(x=>x.id===d.attdelyes);fAtt.del=null;if(!a)return renderAtt();
    if(a.kind==="file"&&assetsNs){try{await assetsNs.delete(a.id)}catch(x){if(x&&x.code==="not_uploader"){toast("Só quem enviou este arquivo, ou quem edita a página, pode removê-lo.");return renderAtt()}}}
    return saveAtt(fAtt.list.filter(x=>x.id!==a.id),"Anexo removido")}
  if(d.kopen){closeFicha();if(window.CS)window.CS.openTask(d.kopen);return}
  if(d.view){state.cronView=d.view;store.set("pgf.view",d.view);if(d.view==="list"){const f=state.filters.cronograma;if(f&&f._dia&&+f._dia!==new Date().getDate())delete f._dia;}return render()}
  if(d.cgroup){const f=(state.filters.cronograma=state.filters.cronograma||{});const v=d.cgroup==="mes"?"semana":d.cgroup;f._sem="";if(v==="hoje"){f._dia=String(new Date().getDate())}else{if(+f._dia===new Date().getDate()&&v!=="hoje")f._dia="";if(v==="atual")f._sem="1";else{state.cronGroup=v;store.set("pgf.cgroup",v)}}return render()}
  if(d.open){const[t,id]=d.open.split("|");return openFicha(t,id,false)}
  if(d.fclose!==undefined)return closeFicha();
  if(d.fsave!==undefined){const[t,id]=d.fsave.split("|");return saveFicha(t,id||null)}
  if(d.fdel!==undefined){if(!fichaArm){fichaArm=true;b.classList.add("armed");b.textContent="Confirmar exclusão";return}
    const[t,id]=$("[data-fsave]").dataset.fsave.split("|");try{const rr=(data[t]||[]).find(x=>x.id===id);if(rr&&window.CS){const ks=t==="cronograma"?Object.values(rr.meses||{}).map(x=>x.kanbanId):[rr.kanbanId];ks.filter(Boolean).forEach(k=>{const kt=window.CS.getTask(k);if(kt&&kt.status!=="concluido")window.CS.removeTask(k)})}await delRow(t,id);closeFicha();toast("Lançamento excluído");render()}catch(err){toast("Não foi possível excluir.")}return}
  if(d.tab)return go(d.tab);
  if(d.add)return openFicha(d.add,null);
  if(d.del){state.confirm=d.del;return render()}
  if(d.delno!==undefined){state.confirm=null;return render()}
  if(d.delyes){const[t,id]=d.delyes.split("|");state.confirm=null;try{await delRow(t,id);toast("Excluído")}catch(err){toast("Não foi possível excluir.")}return render()}
  if(d.fclear){const f=state.filters[d.fclear]||{};Object.keys(f).forEach(k=>{if(k!=="_sem"&&k!=="_pend")f[k]=""});return render()}
  if(d.pend!==undefined){const f=(state.filters.cronograma=state.filters.cronograma||{});f._pend=f._pend===d.pend?"":d.pend;return render()}

    try{const id=await addRow(t,{grupo:g,ano:state.year,cat:"Nova categoria",ordem:n+1,m:{}});setTimeout(()=>{const el=document.querySelector(`[data-medit="${t}|${id}|cat"]`);if(el)startMatrixEdit(el)},250)}catch(err){toast("Não foi possível criar a categoria.")}return}
  if(d.advance!==undefined){state.advance=true;return render()}

  if(d.advyes!==undefined){state.advance=false;const rows=(data.parcelas||[]).slice();let rem=0,av=0;
    for(const r of rows){try{if(r.total&&(+r.atual||0)>=+r.total){await delRow("parcelas",r.id);rem++}else{await updRow("parcelas",r.id,{atual:(+r.atual||0)+1});av++}}catch(err){console.warn(err)}}
    cfg.parcelasRef=addMonths(cfg.parcelasRef,1);await saveCfg();render();toast(`${av} avançaram · ${rem} removidas`);return}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="capForm"||!e.target.closest("#fin"))return;e.preventDefault();
  const inp=$("#fcap");const txt=inp.value.trim();if(!txt){toast("Escreva uma descrição antes de registrar.");return}
  const tb=state.tab.tables[0];const L=LIST[tb.id];const o={criado:Date.now()};o[L.cap]=txt;
  const fl=state.filters[tb.id]||{};Object.entries(fl).forEach(([k,v])=>{if(v)o[k]=v});if(tb.id==="parcelas")o.atual=1;
  try{const id=await addRow(tb.id,o);inp.value="";const kk=$("#fcapk");if(kk&&kk.checked)await kSend(tb.id,id,Object.assign({id},o));toast("Lançamento registrado");setTimeout(()=>openFicha(tb.id,id),200)}catch(err){toast(err&&err.code==="quota_exceeded"?"O painel atingiu o limite de lançamentos.":"Não foi possível registrar.")}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("#fin-drawer").hidden){closeFicha();return}
  if(!e.target.closest||!e.target.closest("#fin"))return;
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[data-open]")){e.preventDefault();const[t,id]=e.target.dataset.open.split("|");openFicha(t,id)}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[data-medit]")){e.preventDefault();startMatrixEdit(e.target)}

document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.matches&&d.matches("details[data-ccm]"))grpOpen["cc:"+d.dataset.ccm]=d.open},true);
document.addEventListener("change",async e=>{const t=e.target;if(!t.matches||!t.matches("[data-fat]"))return;const [mes,c]=t.dataset.fat.split("|"),v=parseNum(t.value),id=(mes+"_"+c).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9_-]+/g,"-");

document.addEventListener("input",e=>{const t=e.target;if(!t.closest||!t.closest("#fin"))return;if(t.dataset&&t.dataset.q!==undefined){state.qs[state.tab.id]=t.value;render()}});
document.addEventListener("change",async e=>{const t=e.target;if(!t.dataset||!t.closest||!t.closest("#fin"))return;
  if(t.id==="fi-file"){const fs=Array.from(t.files||[]);t.value="";return uploadAtt(fs)}
  if(t.dataset.f){const[tb,k]=t.dataset.f.split("|");(state.filters[tb]=state.filters[tb]||{})[k]=t.value;if(k==="_dia"&&t.value)state.filters[tb]._sem="";render()}

  if(t.dataset.ref!==undefined&&t.value){cfg.parcelasRef=t.value;await saveCfg();render()}
  if(t.dataset.qs){const[tb,id,k]=t.dataset.qs.split("|");try{await updStamp(tb,id,{[k]:t.value});toast("Status: "+t.value)}catch(err){toast("Não foi possível atualizar.")}}
});

/* ---------- início ---------- */
state.tab=tabById(store.get("pgf.tab")||"visao");
window.FIN={
  navHTML,go,

(async()=>{

  setSync();for(const k in subs)delete subs[k];

  render();
})();

})();
